    </section>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modal-title">新建项目</h3>
      <input id="modal-input" placeholder="项目名称" />
      <div class="row">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn primary" id="modal-ok">确定</button>
      </div>
    </div>
  </div>


  <div class="settings-backdrop" id="modal-appearance">
    <div class="settings-panel" role="dialog" aria-labelledby="appearance-title">
      <h3 id="appearance-title">外观配置</h3>
      <p class="sub">调整整体色调与文字风格，立即生效并保存在本机。</p>
      <label for="assistant-avatar">助理头像</label>
      <div class="composer-row">
        <input type="file" id="assistant-avatar" accept="image/png,image/jpeg,image/webp" />
        <button type="button" class="btn sm" id="reset-avatar">恢复默认</button>
      </div>
      <p id="avatar-status" class="hint" role="status"></p>
      <label>色调</label>
      <div class="tone-grid" id="tone-grid">
        <button type="button" class="choice" data-tone="warm">暖白 Soft Warm<small>米白画布 · 靛色强调</small></button>
        <button type="button" class="choice" data-tone="cool">冷灰 Cool Soft<small>灰蓝画布 · 蓝色强调</small></button>
        <button type="button" class="choice" data-tone="ink">墨色 Ink<small>中性灰 · 近黑强调</small></button>
      </div>
      <label>文字风格</label>
      <div class="type-grid" id="type-grid">
        <button type="button" class="choice" data-type="compact">紧凑<small>14.5px · 信息密度更高</small></button>
        <button type="button" class="choice" data-type="comfortable">舒适<small>15.5px · 默认推荐</small></button>
        <button type="button" class="choice" data-type="roomy">疏朗<small>16.5px · 阅读更轻松</small></button>
      </div>
      <div class="settings-actions">
        <button type="button" class="btn" id="appearance-close">完成</button>
      </div>
    </div>
  </div>

  <div class="settings-backdrop" id="modal-agent">
    <div class="settings-panel" role="dialog" aria-labelledby="agent-title">
      <h3 id="agent-title">助理配置</h3>
      <p class="sub">设定 Research Companion 的人设与要求，保存在本机。</p>
      <label for="agent-persona">人设</label>
      <input type="text" id="agent-persona" placeholder="例如：严谨、简洁的科研搭档" />
      <label for="agent-instructions">要求 / 指令</label>
      <textarea id="agent-instructions" placeholder="希望它如何回应：语气、格式、禁忌、默认假设…"></textarea>
      <div class="settings-actions">
        <button type="button" class="btn" id="agent-cancel">取消</button>
        <button type="button" class="btn primary" id="agent-save">保存</button>
      </div>
    </div>
  </div>

<script src="/project-map.js"></script>
<script>
(function () {
  const STORAGE_KEY = 'researchos-v2';
  const SETTINGS_KEY = 'researchos-v2-settings';
  const DEFAULT_SETTINGS = {
    appearance: { tone: 'warm', type: 'comfortable' },
    agent: { persona: '严谨、简洁的科研搭档', instructions: '' },
    avatar: '',
  };
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      const s = JSON.parse(raw) || {};
      return {
        appearance: Object.assign({}, DEFAULT_SETTINGS.appearance, s.appearance || {}),
        agent: Object.assign({}, DEFAULT_SETTINGS.agent, s.agent || {}),
        avatar: s.avatar || '',
      };
    } catch (_) {
      return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    }
  }
  function saveSettings() {
    saveState();
  }
  function getAgentCfg() { return appSettings.agent || DEFAULT_SETTINGS.agent; }

  /** Stable hooks for future LLM / chat-driven config mutation (stub now). */
  function patchSettings(partial) {
    if (!partial || typeof partial !== 'object') return appSettings;
    if (partial.appearance) {
      appSettings.appearance = Object.assign({}, appSettings.appearance || {}, partial.appearance);
    }
    if (partial.agent) {
      appSettings.agent = Object.assign({}, appSettings.agent || {}, partial.agent);
    }
    saveSettings();
    applyAppearance();
    return appSettings;
  }
  function proposeConfigFromChat(text) {
    // Lightweight demo stub: parse plain intents; real LLM plugs here later.
    const t = String(text || '');
    const patch = {};
    if (/冷(色|灰)|cool/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'cool' });
    if (/暖|warm/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'warm' });
    if (/墨|黑白|ink/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'ink' });
    if (/紧凑|compact/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'compact' });
    if (/疏朗|大字|roomy/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'roomy' });
    if (/舒适|comfortable/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'comfortable' });
    const persona = t.match(/(?:人设|persona)[:：\s]+([^\n。；;]{2,40})/i);
    if (persona) patch.agent = Object.assign({}, patch.agent || {}, { persona: persona[1].trim() });
    const instr = t.match(/(?:要求|指令|instructions?)[:：\s]+([^\n]{2,200})/i);
    if (instr) patch.agent = Object.assign({}, patch.agent || {}, { instructions: instr[1].trim() });
    if (!Object.keys(patch).length) return null;
    patchSettings(patch);
    return patch;
  }
  window.ResearchOSConfig = {
    get: function () { return JSON.parse(JSON.stringify(appSettings)); },
    patch: patchSettings,
    proposeFromChat: proposeConfigFromChat,
    openAppearance: function () { const b = document.getElementById('btn-appearance'); if (b) b.click(); },
    openAgent: function () { const b = document.getElementById('btn-agent-cfg'); if (b) b.click(); },
    openDsh: openDshBridge,
    dshStatus: refreshDshStatus,
  };

  async function refreshDshStatus() {
    const label = document.getElementById('dsh-status-label');
    try {
      const r = await fetch('/api/dsh/status');
      const j = await r.json();
      if (!label) return j;
      if (!j.listening) label.textContent = '未启动';
      else if (!j.has_launch_token) label.textContent = '缺 token';
      else label.textContent = '本机 :3080';
      return j;
    } catch (e) {
      if (label) label.textContent = '不可达';
      return null;
    }
  }

  async function openDshBridge() {
    const input = document.getElementById('composer-input');
    const text = (input && input.value || '').trim();
    if (text) {
      try {
        await fetch('/api/dsh/handoff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, source: 'researchos-shell' }),
        });
        try { await navigator.clipboard.writeText(text); } catch (_) {}
      } catch (_) {}
    }
    // Same-tab navigation through backend redirect so THIS browser gets the DSH cookie.
    window.open('/api/dsh/open', '_blank', 'noopener');
    refreshDshStatus();
  }

  const btnDsh = document.getElementById('btn-dsh');
  if (btnDsh) btnDsh.addEventListener('click', function (e) { e.preventDefault(); openDshBridge(); });
  const btnHandoff = document.getElementById('btn-dsh-handoff');
  if (btnHandoff) btnHandoff.addEventListener('click', function (e) { e.preventDefault(); openDshBridge(); });
  refreshDshStatus();
  setInterval(refreshDshStatus, 15000);

  function applyAppearance() {
    const a = appSettings.appearance || DEFAULT_SETTINGS.appearance;
    document.documentElement.setAttribute('data-tone', a.tone || 'warm');
    document.documentElement.setAttribute('data-type', a.type || 'comfortable');
  }

  const RAIL_META = {
    ideas:   { title: '点子',   seed: '' },
    feed:    { title: '动态',   seed: '' },
    goals:   { title: '目标',   seed: '' },
    library: { title: '资源库', seed: '' },
  };


  function uid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function nowIso() { return new Date().toISOString(); }
  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleString('zh-CN', { hour12: false });
    } catch (_) { return iso; }
  }

  function defaultState() {
    return {
      version: 2,
      mainThread: {
        id: 'main',
        title: '主聊天',
        messages: [],
      },
      projects: [],
      ui: {
        view: 'main',
        activeProjectId: null,
        activeRail: 'ideas',
      },
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const s = JSON.parse(raw);
      if (!s || s.version !== 2 || !s.mainThread || !Array.isArray(s.projects)) return defaultState();
      if (!Array.isArray(s.mainThread.messages)) s.mainThread.messages = [];
      if (!s.ui) s.ui = { view: 'main', activeProjectId: null, activeRail: 'ideas' };
      return s;
    } catch (_) {
      return defaultState();
    }
  }
  let state = loadState();
  let appSettings = loadSettings();
  let modalMode = null;
  let revision = 0;
  let dirty = false;
  let saving = false;
  let initialized = false;
  let conflict = false;
  let modelStatus = '';
  const pendingChats = new Set();
  const pendingJobs = new Set();
  let projectJobs = {};
  let jobsRead = 0;
  const railMessages = new Map();

  async function workspaceApi(path, payload, pdf = false) {
    const options = payload === undefined ? {} : {
      method: 'POST',
      headers: { 'Content-Type': pdf ? 'application/pdf' : 'application/json' },
      body: pdf ? payload : JSON.stringify(payload),
    };
    const res = await fetch('/api/workspace/' + path, options);
    const result = await res.json();
    if (!res.ok) {
      const error = new Error(result.error || '请求失败');
      error.status = res.status;
      throw error;
    }
    return result;
  }

  function saveState() {
    dirty = true;
    flushWorkspace();
  }

  async function flushWorkspace() {
    if (!initialized || saving || conflict || !dirty) return;
    saving = true;
    $('#workspace-status').textContent = '正在保存…';
    let failed = false;
    try {
      while (dirty) {
        dirty = false;
        const result = await workspaceApi('state', { revision, state, settings: appSettings });
        revision = result.revision;
      }
      $('#workspace-status').textContent = '已保存到本机';
    } catch (error) {
      failed = dirty = true;
      conflict = error.status === 409;
      $('#workspace-status').textContent = conflict ? error.message : '本地保存失败，稍后重试';
    } finally {
      saving = false;
      if (failed && !conflict) setTimeout(flushWorkspace, 5000);
    }
  }

  async function startWorkspace() {
    $('#workspace-status').textContent = '正在读取本地工作区…';
    try {
      const stored = await workspaceApi('state');
      revision = stored.revision;
      if (stored.state) {
        state = stored.state;
        appSettings = stored.settings;
      }
      initialized = true;
      if (!stored.state) saveState();
      applyAppearance();
      $('#stage').inert = false;
      document.querySelector('aside').inert = false;
      $('.topbar').querySelectorAll('button').forEach(button => { button.disabled = false; });
      render();
      readProjectJobs();
    } catch (error) {
      $('#workspace-status').textContent = '无法读取本地工作区，5 秒后重试';
      setTimeout(startWorkspace, 5000);
    }
  }

  const $ = (sel) => document.querySelector(sel);
  const chatScroll = $('#chat-scroll');
  const composer = $('#composer-input');

  function activeProject() {
    return state.projects.find(p => p.id === state.ui.activeProjectId) || null;
  }
  function activeThread(proj) {
    const p = proj || activeProject();
    if (!p) return null;
    return p.threads.find(t => t.id === p.activeThreadId) || p.threads[0] || null;
  }
  function currentMessages() {
    if (state.ui.view === 'main') return state.mainThread.messages;
    const t = activeThread();
    return t ? t.messages : [];
  }

  async function checkHealth() {
    try {
      const status = await workspaceApi('status');
      modelStatus = status.configured ? 'DeepSeek V4.1 Flash' : '未配置 DeepSeek API 密钥';
    } catch (_) {
      modelStatus = '本地服务未连接';
    }
    if (initialized) renderChatControls();
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

  function assistantAvatar() {
    const avatar = appSettings.avatar || '';
    return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(avatar) ? avatar : 'avatar.png';
  }

  function renderNav() {
    $('#sidebar-avatar').src = assistantAvatar();
    $('#proj-count').textContent = String(state.projects.length);
    const list = $('#proj-list');
    list.innerHTML = '';
    state.projects.forEach(p => {
      const row = document.createElement('div');
      row.className = 'proj-row' + (p.id === state.ui.activeProjectId ? ' active' : '');
      row.innerHTML =
        '<button class="proj-btn" title="' + escapeAttr(p.name) + '">' + escapeHtml(p.name) + '</button>' +
        '<button class="icon-btn" title="删除" data-del="' + escapeAttr(p.id) + '">✕</button>';
      row.querySelector('.proj-btn').onclick = () => {
        state.ui.activeProjectId = p.id;
        state.ui.view = 'space';
        saveState(); render();
      };
      row.querySelector('.icon-btn').onclick = (e) => {
        e.stopPropagation();
        deleteProject(p.id);
      };
      list.appendChild(row);
    });

    const showProjRails = !!activeProject() && (state.ui.view === 'space' || state.ui.view === 'project-chat' || state.ui.view === 'rail');
    $('#proj-nav-block').classList.toggle('hidden', !showProjRails);

    document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
      btn.classList.toggle('active',
        (btn.dataset.nav === 'main' && state.ui.view === 'main') ||
        (btn.dataset.nav === 'space' && (state.ui.view === 'space' || state.ui.view === 'project-chat'))
      );
    });
    document.querySelectorAll('.nav-item[data-rail]').forEach(btn => {
      btn.classList.toggle('active', state.ui.view === 'rail' && state.ui.activeRail === btn.dataset.rail);
    });
  }

  function renderTop() {
    const p = activeProject();
    const t = activeThread(p);
    if (state.ui.view === 'main') {
      $('#top-title').innerHTML = '主聊天';
          } else if (state.ui.view === 'space') {
      $('#top-title').innerHTML = '个人空间' + (p ? ' <span class="crumb">' + escapeHtml(p.name) + '</span>' : '');
          } else if (state.ui.view === 'project-chat') {
      $('#top-title').innerHTML = escapeHtml(p ? p.name : '项目') +
        (t ? ' <span class="crumb">' + escapeHtml(t.title) + '</span>' : '');
          } else if (state.ui.view === 'rail') {
      const meta = RAIL_META[state.ui.activeRail];
      $('#top-title').innerHTML = escapeHtml(meta.title) +
        (p ? ' <span class="crumb">' + escapeHtml(p.name) + '</span>' : '');
          }
  }

  function renderChatControls() {
    const thread = state.ui.view === 'main' ? state.mainThread : activeThread();
    const pending = !!thread && pendingChats.has(thread.id);
    $('#btn-send').disabled = pending;
    $('#composer-hint').textContent = pending ? '正在等待回复…' : modelStatus;
  }

  function renderChat() {
    renderChatControls();
    const msgs = currentMessages();
    chatScroll.innerHTML = '';
    if (!msgs.length) {
      const welcome = document.createElement('div');
      welcome.className = 'chat-welcome';
      if (state.ui.view === 'main') {
        welcome.innerHTML =
          '<img src="' + assistantAvatar() + '" alt="" />' +
          '<h2>你好，我是 Research Companion</h2>' +
          '<p>告诉我你正在研究什么，或想一起推进的问题。</p>';
      } else {
        welcome.innerHTML =
          '<h2>开始新对话</h2>' +
          '<p>写下你想讨论的内容。</p>';
      }
      chatScroll.appendChild(welcome);
      return;
    }
    msgs.forEach(m => {
      const el = document.createElement('div');
      el.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
      const av = m.role === 'user'
        ? '<div class="av user-av">你</div>'
        : '<img class="av" src="' + assistantAvatar() + '" alt="" />';
      let body = '<div class="who">' + (m.role === 'user' ? '你' : 'Research Companion') +
        ' · ' + fmtTime(m.ts) + '</div><p>' + escapeHtml(m.text) + '</p>';
      if (m.card && !m.card.workspaceActions) {
        body += '<div class="card"><h4>' + escapeHtml(m.card.title || '结果') + '</h4>';
        if (m.card.pre) body += '<pre>' + escapeHtml(m.card.pre) + '</pre>';
        body += '</div>';
      }
      el.innerHTML = av + '<div class="bubble">' + body + '</div>';
      if (m.card?.workspaceActions?.length) {
        el.querySelector('.bubble').appendChild(actionList(
          m.card.workspaceActions, m.card.applied, () => {
            m.card.applied = true;
            renderChat();
          }));
      }
      chatScroll.appendChild(el);
    });
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function renderMindMap(project) {
    window.renderProjectMap($('#mind-map'), project, {
      ideas: project.rails.ideas.slice().reverse(),
      feed: feedNotes(project).slice().reverse(),
      goals: project.rails.goals.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')),
      library: project.rails.library.slice().reverse(),
    }, {
      status: goal => goalStatus(project, goal),
      open(rail, noteId) {
        state.ui.activeRail = rail;
        state.ui.view = 'rail';
        saveState();
        render();
        const note = [...$('#note-list').children].find(item => item.dataset.noteId === noteId);
        if (note) note.focus();
        else $('#rail-title').focus();
      },
    });
  }

  function renderSpace() {
    const p = activeProject();
    if (!p) {
      $('#space-empty').classList.remove('hidden');
      $('#space-active').classList.add('hidden');
      return;
    }
    $('#space-empty').classList.add('hidden');
    $('#space-active').classList.remove('hidden');
    $('#proj-desc').textContent = '创建于 ' + fmtTime(p.createdAt) + ' · 更新 ' + fmtTime(p.updatedAt);
    renderSchedule(p);
    renderMindMap(p);
    const tl = $('#thread-list');
    tl.innerHTML = '';
    p.threads.forEach(t => {
      const item = document.createElement('div');
      item.className = 'thread-item' + (t.id === p.activeThreadId ? ' active' : '');
      item.innerHTML = '<div class="t-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="t-meta">' + (t.messages || []).length + ' · ' + fmtTime(t.updatedAt || p.updatedAt) + '</div>';
      item.onclick = () => {
        p.activeThreadId = t.id;
        state.ui.view = 'project-chat';
        saveState(); render();
      };
      tl.appendChild(item);
    });
  }

  function actionButton(label, run) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn sm';
    button.textContent = label;
    button.onclick = run;
    return button;
  }

  function railInput(type, label) {
    const input = document.createElement('input');
    input.type = type;
    input.placeholder = label;
    input.setAttribute('aria-label', label);
    return input;
  }

  function showRailStatus(project, rail, message) {
    railMessages.set(project.id + rail, message);
    if (activeProject() === project && state.ui.view === 'rail' && state.ui.activeRail === rail) {
      $('#rail-status').textContent = message;
    }
  }

  function dependencies(project, goal) {
    return (goal.dependsOn || []).map(id => project.rails.goals.find(item => item.id === id)).filter(Boolean);
  }

  function goalStatus(project, goal) {
    if (goal.done) return '已完成';
    const blocked = dependencies(project, goal).some(item => !item.done);
    const today = new Date().toLocaleDateString('sv-SE');
    const late = goal.due && goal.due < today;
    return (late ? '已逾期 · ' : '') + (blocked ? '等待前置目标' : '可推进');
  }

  function renderSchedule(project) {
    const schedule = $('#thought-chain');
    schedule.replaceChildren();
    const goals = project.rails.goals.slice().sort((a, b) =>
      (a.due || '9999').localeCompare(b.due || '9999'));
    if (!goals.length) {
      schedule.textContent = '在「目标」中添加里程碑、截止日期和前置依赖。';
      return;
    }
    const table = document.createElement('table');
    table.className = 'schedule';
    const head = table.createTHead().insertRow();
    ['目标', '截止日期', '前置目标', '状态'].forEach(label => {
      const cell = document.createElement('th');
      cell.scope = 'col';
      cell.textContent = label;
      head.appendChild(cell);
    });
    const rows = table.createTBody();
    goals.forEach(goal => {
      const row = rows.insertRow();
      [goal.text, goal.due || '待排期',
        dependencies(project, goal).map(item => item.text).join('、') || '—',
        goalStatus(project, goal)].forEach(value => { row.insertCell().textContent = value; });
    });
    schedule.appendChild(table);
  }

  function dependencySelect(project, selected = [], excluded = new Set()) {
    const select = document.createElement('select');
    select.multiple = true;
    select.size = 3;
    select.setAttribute('aria-label', '选择前置目标');
    project.rails.goals.filter(goal => !excluded.has(goal.id)).forEach(goal => {
      select.add(new Option(goal.text, goal.id, false, selected.includes(goal.id)));
    });
    return select;
  }

  function goalDependencyField(project) {
    const field = dependencySelect(project);
    field.id = 'goal-dependencies';
    return field;
  }

  function goalEditor(project, goal) {
    const editor = document.createElement('details');
    const heading = document.createElement('summary');
    heading.textContent = '编辑目标';
    const name = railInput('text', '目标名称');
    name.value = goal.text;
    const due = railInput('date', '编辑截止日期');
    due.value = goal.due || '';
    const excluded = new Set([goal.id]);
    for (let size = 0; size !== excluded.size;) {
      size = excluded.size;
      project.rails.goals.forEach(item => {
        if ((item.dependsOn || []).some(id => excluded.has(id))) excluded.add(item.id);
      });
    }
    const before = dependencySelect(project, goal.dependsOn, excluded);
    const save = actionButton('保存目标', () => {
      if (!name.value.trim()) return;
      const ids = Array.from(before.selectedOptions, option => option.value);
      if (goal.done && ids.some(id => !project.rails.goals.find(item => item.id === id)?.done)) {
        showRailStatus(project, 'goals', '已完成的目标不能依赖未完成的目标。');
        return;
      }
      goal.text = name.value.trim();
      goal.due = due.value || undefined;
      goal.dependsOn = ids;
      project.updatedAt = nowIso();
      $('#goal-dependencies')?.replaceWith(goalDependencyField(project));
      railMessages.delete(project.id + 'goals');
      saveState();
      renderRail();
    });
    editor.append(heading, name, due, before, save);
    return editor;
  }

  function actionList(actions, applied, onApply) {
    const box = document.createElement('div');
    const available = actions.filter(action => state.projects.some(p => p.id === action.projectId));
    available.forEach(action => {
      const project = state.projects.find(p => p.id === action.projectId);
      const line = document.createElement('div');
      const before = dependencies(project, action).map(goal => goal.text);
      line.textContent = [project.name, RAIL_META[action.rail].title, action.text,
        action.due, before.length ? '前置目标 ' + before.join('、') : ''].filter(Boolean).join(' · ');
      box.appendChild(line);
    });
    const button = actionButton(applied ? '已写入项目' : '确认写入项目', () => {
      available.forEach(action => {
        const project = state.projects.find(p => p.id === action.projectId);
        addNote(action.rail, action.text, 'DeepSeek', project, {
          due: action.due, dependsOn: dependencies(project, action).map(goal => goal.id),
        }, false);
      });
      onApply();
      saveState();
    });
    button.disabled = applied || !available.length;
    box.appendChild(button);
    return box;
  }

  function activeJob(project, kind) {
    const job = projectJobs[project.id]?.[kind];
    const input = kind === 'feed' ? project.topic : (project.autoReview ? 'daily' : '');
    return job?.input === input ? job : undefined;
  }

  function feedIdentity(note) {
    return note.url || note.text;
  }

  function feedNotes(project) {
    const manual = project.rails.feed.filter(note => !note.automatic);
    const old = project.rails.feed.filter(note => note.automatic).reverse();
    const hidden = new Set(project.dismissedFeed || []);
    const merged = new Map();
    [...(activeJob(project, 'feed')?.items || []), ...old].forEach(note => {
      const key = feedIdentity(note);
      if (!hidden.has(key) && !merged.has(key)) merged.set(key, note);
    });
    return [...manual, ...Array.from(merged.values()).slice(0, 60).reverse()];
  }

  async function readProjectJobs() {
    const ticket = ++jobsRead;
    try {
      const latest = await workspaceApi('automation');
      if (ticket !== jobsRead || JSON.stringify(latest) === JSON.stringify(projectJobs)) return;
      projectJobs = latest;
      if (state.ui.view === 'rail' && ['feed', 'ideas'].includes(state.ui.activeRail)) renderRail();
      if (state.ui.view === 'space' && activeProject()) renderMindMap(activeProject());
    } catch (_) {
      // The next poll retries while preserving the visible results.
    }
  }

  async function waitForSave() {
    await flushWorkspace();
    while (saving) await new Promise(resolve => setTimeout(resolve, 40));
    if (dirty || conflict) throw new Error('请先保存工作区。');
  }

  async function runProjectJob(project, kind) {
    const key = project.id + kind;
    const rail = kind === 'review' ? 'ideas' : 'feed';
    if (pendingJobs.has(key)) return;
    pendingJobs.add(key);
    showRailStatus(project, rail, kind === 'review' ? '正在复盘项目…' : '正在检索论文、新闻和仓库…');
    try {
      await waitForSave();
      await workspaceApi('automation/run', { projectId: project.id, kind });
      railMessages.delete(project.id + rail);
      await readProjectJobs();
    } catch (error) {
      showRailStatus(project, rail, error.message);
    } finally {
      pendingJobs.delete(key);
      if (activeProject() === project && state.ui.view === 'rail' && state.ui.activeRail === rail) renderRail();
    }
  }

  function renderReviews(project) {
    const root = $('#project-reviews');
    root.replaceChildren();
    const job = activeJob(project, 'review');
    if (!job?.reviews?.length) return;
    const entries = document.createElement('details');
    entries.open = true;
    const heading = document.createElement('summary');
    heading.textContent = '复盘记录';
    entries.appendChild(heading);
    job.reviews.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'note';
      const stamp = document.createElement('div');
      stamp.className = 'hint';
      stamp.textContent = fmtTime(entry.ts);
      const body = document.createElement('div');
      body.className = 'n-body';
      body.textContent = entry.reply;
      item.append(stamp, body);
      if (entry.actions.length) {
        item.appendChild(actionList(entry.actions, (project.appliedReviews || []).includes(entry.id), () => {
          project.appliedReviews = [...(project.appliedReviews || []), entry.id];
          renderRail();
        }));
      }
      entries.appendChild(item);
    });
    root.appendChild(entries);
  }

  function renderRailTools(project, rail) {
    const tools = $('#rail-tools');
    const scope = (project?.id || '') + rail;
    if (tools.dataset.scope === scope) return;
    tools.dataset.scope = scope;
    tools.replaceChildren();
    $('#note-input').value = '';
    $('#note-input').placeholder = rail === 'library' ? '资源名称或实验环境说明' : '输入' + RAIL_META[rail].title;
    $('.note-form').hidden = !project;
    if (!project) return;

    if (rail === 'feed') {
      const topic = railInput('search', '关注主题');
      topic.maxLength = 150;
      topic.value = project.topic || '';
      tools.append(topic, actionButton('保存主题并刷新', () => {
        const next = topic.value.trim();
        if (!next) {
          showRailStatus(project, rail, '请输入关注主题。');
          return;
        }
        if (next !== project.topic) project.rails.feed = project.rails.feed.filter(note => !note.automatic);
        project.topic = next;
        saveState();
        runProjectJob(project, 'feed');
      }), actionButton('停止跟踪', () => {
        topic.value = '';
        project.topic = '';
        project.rails.feed = project.rails.feed.filter(note => !note.automatic);
        railMessages.delete(project.id + rail);
        saveState();
        renderRail();
      }));
    }
    if (rail === 'ideas') {
      const toggle = railInput('checkbox', '每天自动复盘');
      toggle.checked = Boolean(project.autoReview);
      const run = actionButton('立即复盘', () => runProjectJob(project, 'review'));
      run.disabled = !toggle.checked;
      const label = document.createElement('label');
      label.append(toggle, '每天用 DeepSeek 复盘本项目');
      toggle.onchange = () => {
        project.autoReview = toggle.checked;
        run.disabled = !toggle.checked;
        railMessages.delete(project.id + rail);
        saveState();
        renderRail();
        if (toggle.checked) runProjectJob(project, 'review');
      };
      tools.append(label, run);
    }
    if (rail === 'goals') {
      const due = railInput('date', '截止日期');
      due.id = 'goal-due';
      const label = document.createElement('label');
      label.textContent = '截止日期 ';
      label.appendChild(due);
      const dependencyLabel = document.createElement('label');
      dependencyLabel.id = 'goal-dependency-label';
      dependencyLabel.append('前置目标 ', goalDependencyField(project));
      tools.append(label, dependencyLabel);
    }
    if (rail === 'library') {
      const link = railInput('url', '仓库或资料链接');
      link.id = 'library-url';
      const pdf = railInput('file', '上传论文 PDF');
      pdf.accept = '.pdf,application/pdf';
      const pdfLabel = document.createElement('label');
      pdfLabel.textContent = '上传论文 PDF ';
      pdfLabel.appendChild(pdf);
      pdf.onchange = async () => {
        const file = pdf.files[0];
        if (!file) return;
        pdf.disabled = true;
        try {
          const result = await workspaceApi('pdf', file, true);
          if (!state.projects.includes(project)) return;
          addNote('library', file.name, '本机 PDF', project, { kind: 'pdf', url: result.url });
          showRailStatus(project, 'library', 'PDF 已保存');
          if (activeProject() === project && state.ui.activeRail === rail && state.ui.view === 'rail') renderRail();
        } catch (error) {
          showRailStatus(project, 'library', error.message);
        } finally {
          pdf.value = '';
          pdf.disabled = false;
        }
      };
      const environment = actionButton('创建 Python 实验环境', async () => {
        environment.disabled = true;
        showRailStatus(project, rail, '正在创建实验目录和虚拟环境…');
        try {
          const result = await workspaceApi('experiment', { projectId: project.id });
          if (!state.projects.includes(project)) return;
          const prior = project.rails.library.find(note => note.kind === 'experiment');
          const body = result.path + '\nPython ' + result.python;
          if (prior) { prior.text = body; saveState(); }
          else addNote('library', body, 'Python 实验环境', project, { kind: 'experiment' });
          showRailStatus(project, 'library', '实验目录和虚拟环境已就绪');
          if (activeProject() === project && state.ui.activeRail === rail && state.ui.view === 'rail') renderRail();
        } catch (error) {
          showRailStatus(project, 'library', error.message);
        } finally {
          environment.disabled = false;
        }
      });
      tools.append(link, pdfLabel, environment);
    }
  }

  function deleteNote(project, rail, note) {
    const dependents = rail === 'goals'
      ? project.rails.goals.filter(goal => (goal.dependsOn || []).includes(note.id))
      : [];
    const prompt = '删除「' + note.text.slice(0, 60) + (note.text.length > 60 ? '…' : '') + '」？';
    const impact = dependents.length ? '\n将解除 ' + dependents.length + ' 个后续目标对此目标的依赖。' : '';
    if (!confirm(prompt + impact)) return false;

    if (rail === 'feed' && note.automatic) {
      project.dismissedFeed = [...new Set([...(project.dismissedFeed || []), feedIdentity(note)])];
    }
    project.rails[rail] = project.rails[rail].filter(item => item.id !== note.id);
    dependents.forEach(goal => { goal.dependsOn = goal.dependsOn.filter(id => id !== note.id); });
    project.updatedAt = nowIso();
    if (rail === 'goals') {
      const field = $('#goal-dependencies');
      field?.querySelectorAll('option').forEach(option => {
        if (option.value === note.id) option.remove();
      });
    }
    saveState();
    renderRail();
    return true;
  }

  function renderRail() {
    const p = activeProject();
    const key = state.ui.activeRail;
    const meta = RAIL_META[key];
    $('#rail-title').textContent = meta.title;
    $('#rail-sub').textContent = '记录与本项目相关的' + meta.title + '。';
    const list = $('#note-list');
    list.innerHTML = '';
    renderRailTools(p, key);
    $('#project-reviews').replaceChildren();
    if (p && key === 'ideas') renderReviews(p);
    const notes = p ? (key === 'feed' ? feedNotes(p) : p.rails[key]) : [];
    const job = p && (key === 'ideas' ? activeJob(p, 'review') : key === 'feed' ? activeJob(p, 'feed') : null);
    const unavailable = job?.unavailable?.length ? ' · 暂不可用 ' + job.unavailable.join('、') : '';
    $('#rail-status').textContent = (p && railMessages.get(p.id + key)) || job?.error ||
      (job?.updated ? '上次更新 ' + fmtTime(job.updated) + unavailable : '');
    if (!notes.length) {
      list.innerHTML = '<div class="note"><div class="n-body" style="color:var(--muted)">暂无条目，在下方添加一条。</div></div>';
      return;
    }
    const ordered = notes.slice().reverse();
    if (key === 'goals') ordered.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    ordered.forEach(n => {
      const el = document.createElement('div');
      el.className = 'note';
      el.dataset.noteId = n.id;
      el.tabIndex = -1;
      el.innerHTML = '<div class="n-meta"><span>' + escapeHtml(n.source || 'manual') + '</span>' +
        '<div class="note-meta-actions"><span>' + fmtTime(n.ts) + '</span></div></div>' +
        '<div class="n-body">' + escapeHtml(n.text) + '</div>';
      const remove = actionButton('删除', () => {
        const next = el.nextElementSibling || el.previousElementSibling;
        if (!deleteNote(p, key, n)) return;
        const replacement = [...list.children].find(item => next && item.dataset.noteId === next.dataset.noteId);
        (replacement?.querySelector('.note-delete') || $('#note-input')).focus();
      });
      remove.classList.add('note-delete');
      remove.setAttribute('aria-label', '删除条目 ' + n.text.slice(0, 60));
      el.querySelector('.note-meta-actions').appendChild(remove);
      if (n.url) {
        const link = document.createElement('a');
        link.href = n.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        if (n.url.startsWith('/api/workspace/pdf/') || /^https?:\/\//i.test(n.url)) {
          link.textContent = n.kind === 'pdf' ? '下载 PDF' : '打开来源';
          el.appendChild(link);
        }
      }
      if (n.published || n.due) {
        const detail = document.createElement('div');
        detail.className = 'hint';
        detail.textContent = n.published || '截止 ' + n.due;
        el.appendChild(detail);
      }
      if (key === 'goals') {
        const done = document.createElement('input');
        done.type = 'checkbox';
        done.checked = Boolean(n.done);
        done.setAttribute('aria-label', '标记目标完成');
        done.disabled = n.done
          ? p.rails.goals.some(item => item.done && (item.dependsOn || []).includes(n.id))
          : dependencies(p, n).some(item => !item.done);
        done.onchange = () => { n.done = done.checked; saveState(); renderRail(); };
        const progress = document.createElement('div');
        progress.className = 'hint';
        const before = dependencies(p, n).map(goal => goal.text);
        progress.append(done, ' ' + goalStatus(p, n) + (before.length ? ' · 前置 ' + before.join('、') : ''));
        el.append(progress, goalEditor(p, n));
      }
      if (key === 'feed' && n.url && /^https?:/i.test(n.url)) {
        const add = actionButton('收藏到资源库', () => {
          addNote('library', n.text, n.source, p, { url: n.url, kind: n.kind });
          renderRail();
        });
        add.disabled = p.rails.library.some(note => note.url === n.url);
        if (add.disabled) add.textContent = '已收藏';
        el.appendChild(add);
      }
      list.appendChild(el);
    });
  }

  function render() {
    renderNav();
    renderTop();
    const view = state.ui.view;
    $('#panel-chat').classList.toggle('hidden', !(view === 'main' || view === 'project-chat'));
    $('#panel-space').classList.toggle('hidden', view !== 'space');
    $('#panel-rail').classList.toggle('hidden', view !== 'rail');
    if (view === 'main' || view === 'project-chat') renderChat();
    if (view === 'space') renderSpace();
    if (view === 'rail') renderRail();
  }

  function pushMessage(role, text, card, project, thread) {
    const msg = { id: uid('m'), role: role, text: text, ts: nowIso() };
    if (card) msg.card = card;
    if (thread) {
      thread.messages.push(msg);
      thread.updatedAt = nowIso();
      if (project) project.updatedAt = thread.updatedAt;
    } else if (state.ui.view === 'main') {
      state.mainThread.messages.push(msg);
    } else {
      const p = activeProject();
      const t = activeThread(p);
      if (!p || !t) return;
      t.messages.push(msg);
      t.updatedAt = nowIso();
      p.updatedAt = nowIso();
    }
    saveState();
  }

  function addNote(rail, text, source, p = activeProject(), details = {}, persist = true) {
    if (!p) return false;
    if (!RAIL_META[rail]) return false;
    if (!p.rails[rail]) p.rails[rail] = [];
    p.rails[rail].push({ id: uid('n'), text: text.trim(), source: source || 'manual', ts: nowIso(), ...details });
    p.updatedAt = nowIso();
    if (persist) saveState();
    return true;
  }

  function summarizeP0(j) {
    const steps = (j && j.steps) || [];
    let short = '完成';
    let lines = [];
    if (j && j.ok === false) {
      return { text: 'P0 返回失败：' + JSON.stringify(j).slice(0, 400), short: 'fail', card: null };
    }
    if (Array.isArray(steps) && steps.length) {
      short = steps.length + ' 步';
      lines = steps.map(function (s, i) {
        const name = s.skill || s.name || ('step-' + (i + 1));
        return (i + 1) + '. ' + name + ' ✓';
      });
    } else {
      lines = ['direction-framing', 'rq-decomposition', 'seed-paper-neighborhood', 'foundational-frontier-split', 'evidence-ledger']
        .map(function (n, i) { return (i + 1) + '. ' + n + ' ✓'; });
    }
    const ledger = j && j.ledger;
    let gapN = 0, rowN = 0;
    if (ledger) {
      rowN = (ledger.rows || []).length;
      gapN = (ledger.gaps || []).length;
    }
    const extra = (rowN || gapN) ? ('\n账本 ' + rowN + ' 行 / gap ' + gapN) : '';
    const text = '已完成研究链路。\n' + lines.join('\n') + extra;
    const pre = JSON.stringify({
      ok: j && j.ok,
      skill: j && j.skill,
      interest: j && j.interest,
      demo_locked_rq: j && j.demo_locked_rq,
      ledger_rows: rowN,
      gaps: gapN,
    }, null, 2);
    return { text: text, short: short + (gapN ? (' · gap ' + gapN) : ''), card: { title: '链路结果', pre: pre } };
  }

  async function runP0Chain(interest) {
    const q = (interest || '').trim() || 'human-guided research companion dual-shelf literature';
    const project = state.ui.view === 'main' ? null : activeProject();
    const thread = project ? activeThread(project) : state.mainThread;
    if (!thread || pendingChats.has(thread.id)) return null;
    pendingChats.add(thread.id);
    pushMessage('assistant', '正在梳理研究链路…', null, project, thread);
    render();
    try {
      const r = await fetch('/api/skills/run/p0-chain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ interest: q, question: q }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || '请求失败');
      if (project && !state.projects.includes(project)) return null;
      const summary = summarizeP0(j);
      pushMessage('assistant', summary.text, summary.card, project, thread);
      if (project) addNote('feed', '示例链路完成：' + summary.short, 'P0', project);
      return j;
    } catch (e) {
      if (!project || state.projects.includes(project)) {
        pushMessage('assistant', '链路调用失败：' + e.message, null, project, thread);
      }
      return null;
    } finally {
      pendingChats.delete(thread.id);
      render();
    }
  }

  async function handleUserText(raw) {
    const text = (raw || '').trim();
    const thread = state.ui.view === 'main' ? state.mainThread : activeThread();
    if (!text || !thread || pendingChats.has(thread.id)) return;
    pushMessage('user', text);
    render();

    const noteMatch = text.match(/^\/note\s+(ideas|feed|goals|library)\s+([\s\S]+)$/i);
    if (noteMatch) {
      const rail = noteMatch[1].toLowerCase();
      const body = noteMatch[2].trim();
      if (!activeProject()) {
        pushMessage('assistant', '请先在个人空间选中或新建一个项目，再写入笔记。');
      } else if (addNote(rail, body, state.ui.view === 'main' ? 'main-chat' : 'project-chat')) {
        pushMessage('assistant', '已写入项目「' + activeProject().name + '」的 ' + RAIL_META[rail].title + '。');
      }
      render();
      return;
    }
    if (/^\/p0-chain\b/i.test(text) || /^跑\s*p0/i.test(text)) {
      const interest = text.replace(/^\/p0-chain\b/i, '').replace(/^跑\s*p0(全链)?/i, '').trim();
      await runP0Chain(interest || text);
      return;
    }
    const cfgPatch = proposeConfigFromChat(text);
    if (cfgPatch) {
      const bits = [];
      if (cfgPatch.appearance) bits.push('外观已更新');
      if (cfgPatch.agent) bits.push('助理配置已更新');
      pushMessage('assistant', bits.join('，') + '。也可随时点右上角「助理配置」或左下「外观配置」微调。');
      render();
      return;
    }
    const project = state.ui.view === 'main' ? null : activeProject();
    pendingChats.add(thread.id);
    renderChatControls();
    const projects = (project ? [project] : state.projects).map(p => ({
      id: p.id,
      name: p.name,
      topic: p.topic,
      recentFeed: feedNotes(p).filter(note => note.automatic).slice(-5).reverse(),
      notes: Object.fromEntries(Object.entries(p.rails).map(([rail, notes]) =>
        [rail, notes.slice(-5).map(n => ({
          id: n.id, text: n.text.slice(0, 500), due: n.due, done: n.done, url: n.url, dependsOn: n.dependsOn,
        }))])),
    }));
    try {
      const result = await workspaceApi('chat', {
        messages: thread.messages.slice(-16).filter(m => !m.error).map(m => ({
          role: m.role, text: m.text.slice(0, 4000),
        })),
        context: { scope: project ? 'project' : 'global', today: new Date().toLocaleDateString('sv-SE'),
          agent: getAgentCfg(), projects },
        allowedProjects: projects.map(p => p.id),
      });
      if (project && !state.projects.includes(project)) return;
      pushMessage('assistant', result.reply, { workspaceActions: result.actions }, project, thread);
    } catch (error) {
      if (project && !state.projects.includes(project)) return;
      thread.messages.push({ id: uid('m'), role: 'assistant', text: error.message, error: true, ts: nowIso() });
      saveState();
    } finally {
      pendingChats.delete(thread.id);
      render();
    }
  }

  function openModal(mode, preset) {
    modalMode = mode;
    $('#modal').classList.add('show');
    const input = $('#modal-input');
    if (mode === 'create') {
      $('#modal-title').textContent = '新建项目';
      input.value = '';
      input.placeholder = '项目名称';
    } else if (mode === 'rename') {
      $('#modal-title').textContent = '重命名项目';
      input.value = preset || '';
      input.placeholder = '新名称';
    } else if (mode === 'thread') {
      $('#modal-title').textContent = '新建对话';
      input.value = '';
      input.placeholder = '对话标题';
    }
    setTimeout(function () { input.focus(); }, 50);
  }
  function closeModal() {
    $('#modal').classList.remove('show');
    modalMode = null;
  }

  function createProject(name) {
    const n = (name || '').trim() || ('课题 ' + (state.projects.length + 1));
    const tid = uid('thr');
    const p = {
      id: uid('proj'),
      name: n,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      activeThreadId: tid,
      threads: [{
        id: tid,
        title: '默认对话',
        messages: [],
        updatedAt: nowIso(),
      }],
      rails: { ideas: [], feed: [], goals: [], library: [] },
    };
    state.projects.unshift(p);
    state.ui.activeProjectId = p.id;
    state.ui.view = 'space';
    saveState(); render();
  }

  function deleteProject(id) {
    if (!confirm('删除该项目及其对话 / 笔记？')) return;
    state.projects = state.projects.filter(function (p) { return p.id !== id; });
    if (state.ui.activeProjectId === id) {
      state.ui.activeProjectId = state.projects[0] ? state.projects[0].id : null;
      state.ui.view = state.ui.activeProjectId ? 'space' : 'main';
    }
    saveState(); render();
  }

  function renameProject(name) {
    const p = activeProject();
    if (!p) return;
    const n = (name || '').trim();
    if (!n) return;
    p.name = n; p.updatedAt = nowIso();
    saveState(); render();
  }

  function createThread(title) {
    const p = activeProject();
    if (!p) return;
    const t = {
      id: uid('thr'),
      title: (title || '').trim() || ('对话 ' + (p.threads.length + 1)),
      messages: [],
      updatedAt: nowIso(),
    };
    p.threads.unshift(t);
    p.activeThreadId = t.id;
    p.updatedAt = nowIso();
    state.ui.view = 'project-chat';
    saveState(); render();
  }

  $('#nav-main').onclick = function () { state.ui.view = 'main'; saveState(); render(); };
  $('#nav-space').onclick = function () { state.ui.view = 'space'; saveState(); render(); };
  document.querySelectorAll('.nav-item[data-rail]').forEach(function (btn) {
    btn.onclick = function () {
      if (!activeProject()) { state.ui.view = 'space'; saveState(); render(); return; }
      state.ui.activeRail = btn.dataset.rail;
      state.ui.view = 'rail';
      saveState(); render();
    };
  });
  $('#btn-new-project').onclick = function () { openModal('create'); };
  $('#btn-new-project-2').onclick = function () { openModal('create'); };
  $('#btn-rename-project').onclick = function () {
    const p = activeProject();
    if (p) openModal('rename', p.name);
  };
  $('#btn-delete-project').onclick = function () {
    const p = activeProject();
    if (p) deleteProject(p.id);
  };
  $('#btn-new-thread').onclick = function () { openModal('thread'); };
  $('#btn-open-chat').onclick = function () {
    if (!activeProject()) return;
    state.ui.view = 'project-chat';
    saveState(); render();
  };
  $('#modal-cancel').onclick = closeModal;
  $('#modal-ok').onclick = function () {
    const v = $('#modal-input').value;
    if (modalMode === 'create') createProject(v);
    else if (modalMode === 'rename') renameProject(v);
    else if (modalMode === 'thread') createThread(v);
    closeModal();
  };
  $('#modal-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#modal-ok').click(); }
    if (e.key === 'Escape') closeModal();
  });
  $('#btn-send').onclick = function () {
    const v = composer.value;
    composer.value = '';
    handleUserText(v);
  };
  const btnP0 = $('#btn-run-p0');
  if (btnP0) {
    btnP0.onclick = function () {
      const v = composer.value.trim();
      runP0Chain(v);
      composer.value = '';
    };
  }
  composer.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('#btn-send').click();
    }
  });
  $('#btn-add-note').onclick = function () {
    const project = activeProject();
    const rail = state.ui.activeRail;
    const input = $('#note-input');
    const due = $('#goal-due');
    const link = $('#library-url');
    const url = link?.value.trim();
    if (url && !/^https?:\/\//i.test(url)) {
      showRailStatus(project, rail, '请输入 HTTP 或 HTTPS 链接。');
      return;
    }
    const body = input.value.trim() || url;
    if (!body || !project) return;
    const predecessors = $('#goal-dependencies');
    const dependsOn = Array.from(predecessors?.selectedOptions || [], option => option.value);
    addNote(rail, body, '手动', project, { due: due?.value || undefined, url: url || undefined, dependsOn });
    if (predecessors) predecessors.replaceWith(goalDependencyField(project));
    input.value = '';
    if (due) due.value = '';
    if (link) link.value = '';
    renderRail();
  };


  function syncAppearanceChoices() {
    const a = appSettings.appearance || DEFAULT_SETTINGS.appearance;
    document.querySelectorAll('#tone-grid .choice').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tone === a.tone);
    });
    document.querySelectorAll('#type-grid .choice').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.type === a.type);
    });
  }
  function openAppearance() {
    syncAppearanceChoices();
    $('#modal-appearance').classList.add('show');
  }
  function closeAppearance() {
    $('#modal-appearance').classList.remove('show');
  }
  function openAgentCfg() {
    const ag = getAgentCfg();
    $('#agent-persona').value = ag.persona || '';
    $('#agent-instructions').value = ag.instructions || '';
    $('#modal-agent').classList.add('show');
    setTimeout(function () { $('#agent-persona').focus(); }, 40);
  }
  function closeAgentCfg() {
    $('#modal-agent').classList.remove('show');
  }
  function saveAgentCfg() {
    appSettings.agent = {
      persona: ($('#agent-persona').value || '').trim(),
      instructions: ($('#agent-instructions').value || '').trim(),
    };
    saveSettings();
    closeAgentCfg();
  }

  const btnAppearance = $('#btn-appearance');
  if (btnAppearance) btnAppearance.onclick = openAppearance;
  const btnAgent = $('#btn-agent-cfg');
  if (btnAgent) btnAgent.onclick = openAgentCfg;
  const appearanceClose = $('#appearance-close');
  if (appearanceClose) appearanceClose.onclick = closeAppearance;
  const agentCancel = $('#agent-cancel');
  if (agentCancel) agentCancel.onclick = closeAgentCfg;
  const agentSave = $('#agent-save');
  if (agentSave) agentSave.onclick = saveAgentCfg;
  document.querySelectorAll('#tone-grid .choice').forEach(function (btn) {
    btn.onclick = function () {
      appSettings.appearance = appSettings.appearance || {};
      appSettings.appearance.tone = btn.dataset.tone;
      saveSettings();
      applyAppearance();
      syncAppearanceChoices();
    };
  });
  document.querySelectorAll('#type-grid .choice').forEach(function (btn) {
    btn.onclick = function () {
      appSettings.appearance = appSettings.appearance || {};
      appSettings.appearance.type = btn.dataset.type;
      saveSettings();
      applyAppearance();
      syncAppearanceChoices();
    };
  });
  $('#modal-appearance').addEventListener('click', function (e) {
    if (e.target === $('#modal-appearance')) closeAppearance();
  });
  $('#modal-agent').addEventListener('click', function (e) {
    if (e.target === $('#modal-agent')) closeAgentCfg();
  });

  $('#assistant-avatar').onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;
    const status = $('#avatar-status');
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 512 * 1024) {
      status.textContent = '请选择不超过 512 KB 的 PNG、JPEG 或 WebP 图片。';
      event.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => { status.textContent = '无法读取头像文件。'; };
    reader.onload = async () => {
      const preview = new Image();
      preview.src = reader.result;
      try {
        await preview.decode();
        appSettings.avatar = reader.result;
        saveSettings();
        render();
        status.textContent = '头像已更新';
      } catch (_) {
        status.textContent = '无法打开这张图片。';
      }
    };
    reader.readAsDataURL(file);
  };
  $('#reset-avatar').onclick = () => {
    appSettings.avatar = '';
    $('#assistant-avatar').value = '';
    $('#avatar-status').textContent = '已恢复默认头像';
    saveSettings();
    render();
  };
  $('#stage').inert = true;
  document.querySelector('aside').inert = true;
  $('.topbar').querySelectorAll('button').forEach(button => { button.disabled = true; });
  checkHealth();
  startWorkspace();
  setInterval(checkHealth, 15000);
  setInterval(() => { if (initialized) readProjectJobs(); }, 15000);
  window.addEventListener('beforeunload', event => {
    if (dirty || saving) event.preventDefault();
  });
})();
</script>
</body>
</html>
