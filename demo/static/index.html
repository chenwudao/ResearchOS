<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Research Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f2ee;
      --bg-elev: #ffffff;
      --bg-soft: #faf9f7;
      --bg-muted: #eeebe6;
      --rail: #f7f6f3;
      --ink: #171717;
      --ink-2: #3f3f46;
      --muted: #71717a;
      --muted-2: #a1a1aa;
      --line: #e7e5e0;
      --line-2: #d6d3cd;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --accent-ink: #3730a3;
      --ok: #16a34a;
      --warn: #ca8a04;
      --danger: #dc2626;
      --node-ideas: #4f46e5;
      --node-feed: #7c3aed;
      --node-goals: #059669;
      --node-lib: #d97706;
      --shadow: 0 1px 2px rgba(23,23,23,.04), 0 8px 24px rgba(23,23,23,.05);
      --r: 14px;
      --r-sm: 10px;
      --rail-w: 248px;
      --font: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      font-size: 15.5px;
      line-height: 1.5;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      display: grid;
      grid-template-columns: var(--rail-w) 1fr;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }
    .rail {
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .rail-head {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--line);
    }
    .rail-head img {
      width: 52px; height: 52px; border-radius: 16px; object-fit: cover;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      animation: av-breathe 4.8s ease-in-out infinite;
    }
    @keyframes av-breathe {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: var(--shadow); }
      50% { transform: translateY(-1px) scale(1.03); box-shadow: 0 4px 18px rgba(79,70,229,.14); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail-head img, .chat-welcome img { animation: none; }
    }
    .rail-head .titles { min-width: 0; }
    .rail-head .titles strong {
      display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rail-head .titles span {
      display: block; font-size: 13px; color: var(--muted); margin-top: 2px;
    }
    .nav-sec {
      padding: 16px 16px 8px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em;
    }
    .nav-item {
      margin: 2px 10px;
      width: calc(100% - 20px);
      display: flex; align-items: center; gap: 12px;
      border: none; background: transparent;
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--ink-2);
      text-align: left;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: rgba(255,255,255,.72); color: var(--ink); }
    .nav-item.active {
      background: var(--bg-elev);
      color: var(--accent-ink);
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .nav-item .ico {
      width: 20px; height: 20px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; opacity: .9;
    }
    .nav-item .lbl { flex: 1; font-size: 14.5px; }
    .nav-item .badge {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--bg-muted); border-radius: 999px; padding: 2px 8px;
    }
    .rail-scroll { flex: 1; overflow: auto; min-height: 0; padding-bottom: 12px; }
    .proj-list { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 4px; }
    .proj-row {
      display: flex; align-items: center; gap: 4px;
      border-radius: 12px;
      padding: 2px;
    }
    .proj-row.active { background: var(--bg-elev); box-shadow: var(--shadow); }
    .proj-row .proj-btn {
      flex: 1; border: none; background: transparent;
      text-align: left; padding: 10px 12px; border-radius: 10px;
      color: var(--ink-2); font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .proj-row.active .proj-btn { color: var(--accent-ink); font-weight: 600; }
    .proj-row .icon-btn {
      border: none; background: transparent; color: var(--muted-2);
      width: 30px; height: 30px; border-radius: 8px; padding: 0;
      display: none; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .proj-row:hover .icon-btn { display: inline-flex; }
    .proj-row .icon-btn:hover { background: var(--bg-muted); color: var(--danger); }
    .rail-actions { padding: 8px 12px 12px; display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--line-2);
      background: var(--bg-elev);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px; font-weight: 550;
      color: var(--ink-2);
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
    }
    .btn:hover { background: var(--bg-soft); border-color: var(--muted-2); }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
      box-shadow: 0 1px 2px rgba(79,70,229,.25);
    }
    .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.sm { padding: 8px 14px; font-size: 13.5px; }
    .btn.block { width: 100%; }
    .rail-foot {
      border-top: 1px solid var(--line);
      padding: 14px 16px;
      font-size: 13px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .rail-foot .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
    }
    .rail-foot.ok .dot { background: var(--ok); }
    .rail-foot.bad .dot { background: var(--danger); }
    .main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0; min-height: 0;
      background: var(--bg);
    }
    .topbar {
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      min-height: 60px;
    }
    .topbar h1 {
      margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    }
    .topbar .crumb { color: var(--muted); font-size: 14px; margin-left: 8px; font-weight: 400; }
    .topbar .spacer { flex: 1; }
    .topbar .meta { font-size: 13px; color: var(--muted); }
    .stage {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 0; overflow: hidden;
    }
    .panel {
      display: flex; flex-direction: column;
      min-width: 0; min-height: 0; overflow: hidden;
    }
    .chat-scroll {
      flex: 1; overflow: auto; padding: 24px 28px 16px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      display: flex; gap: 12px; max-width: 820px; width: 100%;
      align-self: flex-start;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .av {
      width: 36px; height: 36px; border-radius: 12px; flex: 0 0 auto;
      object-fit: cover; border: 1px solid var(--line); background: #fff;
    }
    .msg .av.user-av {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-muted); font-size: 12px; font-weight: 600; color: var(--muted);
      border: 1px solid var(--line);
    }
    .bubble {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      max-width: min(640px, 100%);
      box-shadow: var(--shadow);
    }
    .msg.user .bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .bubble .who {
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      margin-bottom: 6px;
    }
    .msg.user .bubble .who { color: rgba(255,255,255,.78); }
    .bubble p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble .card {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ink);
    }
    .msg.user .bubble .card {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.25);
      color: #fff;
    }
    .card h4 { margin: 0 0 8px; font-size: 13.5px; font-weight: 600; }
    .card pre {
      margin: 0; font-family: var(--mono); font-size: 12.5px;
      white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto;
      line-height: 1.55;
    }
    .composer {
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(8px);
      padding: 16px 24px 20px;
    }
    .composer-box {
      display: flex; flex-direction: column; gap: 12px;
      border: 1px solid var(--line-2);
      border-radius: 16px;
      background: var(--bg-elev);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .composer-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .composer-box textarea {
      border: none; outline: none; resize: none; background: transparent;
      min-height: 52px; max-height: 160px; width: 100%;
      line-height: 1.5; font-size: 15.5px;
    }
    .composer-row {
      display: flex; align-items: center; gap: 10px;
    }
    .hint {
      font-size: 13px; color: var(--muted);
      flex: 1;
    }
    .hint code {
      font-family: var(--mono); font-size: 12.5px;
      background: var(--bg-muted); padding: 2px 7px; border-radius: 6px;
    }
    .empty {
      margin: auto; text-align: center; padding: 56px 28px; color: var(--muted);
      max-width: 440px;
    }
    .empty h2 { margin: 0 0 10px; color: var(--ink); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .empty p { margin: 0 0 20px; font-size: 15px; line-height: 1.55; }
    .workspace {
      flex: 1; overflow: auto; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .grid-2 {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;
    }
    @media (max-width: 980px) {
      .grid-2 { grid-template-columns: 1fr; }
      .app { grid-template-columns: 72px 1fr; }
      .rail-head .titles, .nav-sec, .nav-item .lbl, .nav-item .badge,
      .rail-actions .btn span, .rail-foot span.txt { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .proj-row .proj-btn { padding: 10px; font-size: 13px; }
      .rail-actions { flex-direction: column; }
    }
    .card-block {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card-block h3 {
      margin: 0 0 14px; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      letter-spacing: -0.01em;
    }
    .chain {
      font-family: var(--mono); font-size: 13px; color: var(--ink-2);
      background: var(--bg-soft); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px;
      white-space: pre-wrap; line-height: 1.6;
    }
    .thread-list { display: flex; flex-direction: column; gap: 8px; }
    .thread-item {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; background: var(--bg-soft);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .thread-item:hover, .thread-item.active {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .thread-item .t-title { flex: 1; font-size: 14.5px; font-weight: 500; }
    .thread-item .t-meta { font-size: 13px; color: var(--muted); }
    .note-list { display: flex; flex-direction: column; gap: 10px; }
    .note {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; background: var(--bg-soft);
    }
    .note .n-meta {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 12.5px; color: var(--muted); margin-bottom: 6px;
    }
    .note .n-meta { align-items: center; flex-wrap: wrap; }
    .note-meta-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .note-delete { color: var(--danger); }
    .note .n-body { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
    .note-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .note-form textarea {
      border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; min-height: 72px; resize: vertical; background: #fff;
      font-size: 15px;
    }
    .note-form textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill {
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      background: var(--bg-muted); border-radius: 999px; padding: 6px 12px;
      border: 1px solid var(--line);
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(23,23,23,.32);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; border: 1px solid var(--line);
      width: min(440px, calc(100vw - 32px)); padding: 22px;
      box-shadow: 0 16px 48px rgba(23,23,23,.16);
    }
    .modal h3 { margin: 0 0 14px; font-size: 17px; letter-spacing: -0.02em; }
    .modal input {
      width: 100%; border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 16px; font-size: 15px;
    }
    .modal input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .modal .row { display: flex; justify-content: flex-end; gap: 10px; }
    .cfg-btn {
      border: 1px solid var(--line-2);
      background: var(--bg-elev);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      display: inline-flex; align-items: center; gap: 10px;
      box-shadow: var(--shadow);
      transition: background .12s, border-color .12s, transform .12s;
    }
    .cfg-btn:hover { background: var(--bg-soft); border-color: var(--muted-2); }
    .cfg-btn:active { transform: scale(.98); }
    .cfg-btn .cfg-ico {
      width: 28px; height: 28px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent-ink); font-size: 14px;
      flex: 0 0 auto;
    }
    .cfg-btn .cfg-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .cfg-btn .cfg-copy strong { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
    .cfg-btn .cfg-copy span { font-size: 12.5px; font-weight: 450; color: var(--muted); }
    .rail-foot {
      display: flex !important;
      border-top: 1px solid var(--line);
      padding: 14px 12px;
      gap: 8px;
    }
    .rail-foot .cfg-btn { flex: 1; justify-content: flex-start; padding: 14px 14px; }
    #btn-agent-cfg { padding: 10px 14px; }
    .settings-backdrop {
      position: fixed; inset: 0; background: rgba(23,23,23,.32);
      display: none; align-items: center; justify-content: center; z-index: 60;
    }
    .settings-backdrop.show { display: flex; }
    .settings-panel {
      background: #fff; border-radius: 16px; border: 1px solid var(--line);
      width: min(520px, calc(100vw - 32px)); max-height: min(86vh, 760px);
      overflow: auto; padding: 22px; box-shadow: 0 16px 48px rgba(23,23,23,.16);
    }
    .settings-panel h3 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.02em; }
    .settings-panel .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .settings-panel label {
      display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
      margin: 14px 0 8px;
    }
    .settings-panel label:first-of-type { margin-top: 0; }
    .settings-panel textarea, .settings-panel input[type="text"] {
      width: 100%; border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; font: inherit; background: #fff; color: var(--ink);
    }
    .settings-panel textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .settings-panel textarea:focus, .settings-panel input[type="text"]:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .tone-grid, .type-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .type-grid { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 640px) { .type-grid { grid-template-columns: 1fr; } }
    .choice {
      border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 12px; background: var(--bg-soft); text-align: left;
      color: var(--ink-2); font-size: 14px; font-weight: 500;
    }
    .choice:hover { border-color: var(--muted-2); }
    .choice.active {
      border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    .choice small { display: block; margin-top: 4px; color: var(--muted); font-weight: 400; font-size: 12.5px; }
    .settings-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .chat-welcome {
      margin: auto;
      text-align: center;
      padding: 64px 28px 40px;
      max-width: 520px;
      color: var(--muted);
    }
    .chat-welcome img {
      width: 88px; height: 88px; border-radius: 24px;
      object-fit: cover; border: 1px solid var(--line);
      box-shadow: var(--shadow); margin-bottom: 22px;
      animation: av-breathe 4.8s ease-in-out infinite;
    }
    .chat-welcome h2 {
      margin: 0 0 10px; color: var(--ink);
      font-size: 22px; font-weight: 600; letter-spacing: -0.03em;
    }
    .chat-welcome p {
      margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--muted);
    }
    html[data-tone="cool"] {
      --bg: #f3f5f8; --bg-elev: #ffffff; --bg-soft: #f7f9fc; --bg-muted: #e8edf3;
      --rail: #f5f7fa; --line: #e2e8f0; --line-2: #cbd5e1;
      --accent: #2563eb; --accent-soft: #eff6ff; --accent-ink: #1d4ed8;
    }
    html[data-tone="warm"] {
      --bg: #f4f2ee; --bg-elev: #ffffff; --bg-soft: #faf9f7; --bg-muted: #eeebe6;
      --rail: #f7f6f3; --line: #e7e5e0; --line-2: #d6d3cd;
      --accent: #4f46e5; --accent-soft: #eef2ff; --accent-ink: #3730a3;
    }
    html[data-tone="ink"] {
      --bg: #f0f0f0; --bg-elev: #ffffff; --bg-soft: #f7f7f7; --bg-muted: #e5e5e5;
      --rail: #f5f5f5; --line: #e5e5e5; --line-2: #d4d4d4;
      --accent: #171717; --accent-soft: #f5f5f5; --accent-ink: #171717;
    }
    html[data-type="compact"] body { font-size: 14.5px; }
    html[data-type="comfortable"] body { font-size: 15.5px; }
    html[data-type="roomy"] body { font-size: 16.5px; }
    html[data-type="compact"] .bubble p, html[data-type="compact"] .composer-box textarea { font-size: 14.5px; }
    html[data-type="roomy"] .bubble p, html[data-type="roomy"] .composer-box textarea { font-size: 16.5px; }
    .hidden { display: none !important; }
    #rail-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .schedule { width: 100%; border-collapse: collapse; text-align: left; }
    .schedule th, .schedule td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    #thought-chain { overflow-x: auto; }
    #project-reviews .note { margin: 8px 0; }
    #rail-tools input { max-width: 100%; padding: 6px; color: var(--ink); }
    #rail-tools label { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    #rail-status:empty, .note-form[hidden] { display: none; }
    .note a { color: inherit; }
  </style>
  <link rel="stylesheet" href="/project-map.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-head">
        <img src="avatar.png" id="sidebar-avatar" alt="Research Companion" />
        <div class="titles">
          <strong>Research Companion</strong>
          <span>Research Companion</span>
        </div>
      </div>
      <div class="rail-scroll">
        <div class="nav-sec">Workspace</div>
        <button class="nav-item active" data-nav="main" id="nav-main">
          <span class="ico">◈</span><span class="lbl">主聊天</span>
        </button>
        <button class="nav-item" data-nav="space" id="nav-space">
          <span class="ico">▣</span><span class="lbl">个人空间</span>
          <span class="badge" id="proj-count">0</span>
        </button>

        <div id="proj-nav-block" class="hidden">
          <div class="nav-sec">当前项目</div>
          <button class="nav-item" data-rail="ideas" id="nav-ideas">
            <span class="ico">◇</span><span class="lbl">点子</span>
          </button>
          <button class="nav-item" data-rail="feed" id="nav-feed">
            <span class="ico">◎</span><span class="lbl">动态</span>
          </button>
          <button class="nav-item" data-rail="goals" id="nav-goals">
            <span class="ico">◎</span><span class="lbl">目标</span>
          </button>
          <button class="nav-item" data-rail="library" id="nav-library">
            <span class="ico">▤</span><span class="lbl">资源库</span>
          </button>
        </div>

        <div class="nav-sec">项目</div>
        <div class="proj-list" id="proj-list"></div>
        <div class="rail-actions">
          <button class="btn block" id="btn-new-project"><span>+ 新建项目</span></button>
        </div>
      </div>
      <div class="rail-foot" id="appearance-foot">
        <button type="button" class="cfg-btn" id="btn-appearance" title="外观配置">
          <span class="cfg-ico">Aa</span>
          <span class="cfg-copy"><strong>外观配置</strong><span>色调 · 文字风格</span></span>
        </button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <h1 id="top-title">主聊天 <span class="crumb" id="top-crumb"></span></h1>
        <div class="spacer"></div>
        <span class="hint" id="workspace-status" role="status"></span>
        <button type="button" class="cfg-btn" id="btn-agent-cfg" title="助理配置">
          <span class="cfg-ico">✦</span>
          <span class="cfg-copy"><strong>助理配置</strong><span>人设 · 要求</span></span>
        </button>
        <button type="button" class="cfg-btn" id="btn-dsh" title="打开 DeepSeek Harness（本机 :3080）">
          <span class="cfg-ico">◎</span>
          <span class="cfg-copy"><strong>DSH</strong><span id="dsh-status-label">检测中…</span></span>
        </button>
      </header>
      <div class="stage" id="stage">
        <div class="panel" id="panel-chat">
          <div class="chat-scroll" id="chat-scroll"></div>
          <div class="composer">
            <div class="composer-box">
              <textarea id="composer-input" rows="2" placeholder="说说你的科研兴趣或想推进的问题…"></textarea>
              <div class="composer-row">
                <div class="hint" id="composer-hint"></div>
                <button class="btn" id="btn-dsh-handoff" title="把当前输入交给本机 DeepSeek Harness">在 DSH 继续</button>
                <button class="btn primary" id="btn-send">发送</button>
              </div>
            </div>
          </div>
        </div>

        <div class="panel hidden" id="panel-space">
          <div class="workspace" id="space-empty">
            <div class="empty">
              <h2>个人空间</h2>
              <p>为课题建项目，整理点子、动态、目标与资源库。</p>
              <button class="btn primary" id="btn-new-project-2">新建项目</button>
            </div>
          </div>
          <div class="workspace hidden" id="space-active">
            <section class="card-block map-card" aria-labelledby="project-map-title">
              <h3 id="project-map-title">课题关系图</h3>
              <div class="project-map" id="mind-map"></div>
            </section>
            <section class="card-block">
              <h3>项目时间表</h3>
              <div class="chain" id="thought-chain"></div>
            </section>
            <div class="grid-2">
              <div class="card-block">
                <h3>
                  项目对话
                  <button class="btn sm" id="btn-new-thread" style="margin-left:auto">+ 新对话</button>
                </h3>
                <div class="thread-list" id="thread-list"></div>
              </div>
              <div class="card-block">
                <h3>项目信息</h3>
                <p style="margin:0 0 8px;font-size:13px;color:var(--ink-2)" id="proj-desc"></p>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <button class="btn sm" id="btn-rename-project">重命名</button>
                  <button class="btn sm" id="btn-open-chat">打开当前对话</button>
                  <button class="btn sm" id="btn-delete-project" style="color:var(--danger)">删除项目</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel hidden" id="panel-rail">
          <div class="workspace">
            <div class="card-block">
              <h3 id="rail-title" tabindex="-1">点子</h3>
              <p style="margin:0 0 14px;font-size:14px;color:var(--muted)" id="rail-sub">在这里记录本项目相关内容。</p>
              <div id="rail-tools"></div>
              <div id="project-reviews"></div>
              <p class="hint" id="rail-status" role="status"></p>
              <div class="note-list" id="note-list"></div>
              <div class="note-form">
                <textarea id="note-input" placeholder="自定义推送或笔记…"></textarea>
                <div class="composer-row">
                  <div class="hint"></div>
                  <button class="btn primary sm" id="btn-add-note">添加</button>
                </div>
