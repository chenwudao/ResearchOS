<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Research Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f2ee;
      --bg-elev: #ffffff;
      --bg-soft: #faf9f7;
      --bg-muted: #eeebe6;
      --rail: #f7f6f3;
      --ink: #171717;
      --ink-2: #3f3f46;
      --muted: #71717a;
      --muted-2: #a1a1aa;
      --line: #e7e5e0;
      --line-2: #d6d3cd;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --accent-ink: #3730a3;
      --ok: #16a34a;
      --warn: #ca8a04;
      --danger: #dc2626;
      --node-ideas: #4f46e5;
      --node-feed: #7c3aed;
      --node-goals: #059669;
      --node-lib: #d97706;
      --shadow: 0 1px 2px rgba(23,23,23,.04), 0 8px 24px rgba(23,23,23,.05);
      --r: 14px;
      --r-sm: 10px;
      --rail-w: 248px;
      --font: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      font-size: 15.5px;
      line-height: 1.5;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      display: grid;
      grid-template-columns: var(--rail-w) 1fr;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }
    .rail {
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .rail-head {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid var(--line);
    }
    .rail-head img {
      width: 52px; height: 52px; border-radius: 16px; object-fit: cover;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      animation: av-breathe 4.8s ease-in-out infinite;
    }
    @keyframes av-breathe {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: var(--shadow); }
      50% { transform: translateY(-1px) scale(1.03); box-shadow: 0 4px 18px rgba(79,70,229,.14); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail-head img, .chat-welcome img { animation: none; }
    }
    .rail-head .titles { min-width: 0; }
    .rail-head .titles strong {
      display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rail-head .titles span {
      display: block; font-size: 13px; color: var(--muted); margin-top: 2px;
    }
    .nav-sec {
      padding: 16px 16px 8px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em;
    }
    .nav-item {
      margin: 2px 10px;
      width: calc(100% - 20px);
      display: flex; align-items: center; gap: 12px;
      border: none; background: transparent;
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--ink-2);
      text-align: left;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: rgba(255,255,255,.72); color: var(--ink); }
    .nav-item.active {
      background: var(--bg-elev);
      color: var(--accent-ink);
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .nav-item .ico {
      width: 20px; height: 20px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; opacity: .9;
    }
    .nav-item .lbl { flex: 1; font-size: 14.5px; }
    .nav-item .badge {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--bg-muted); border-radius: 999px; padding: 2px 8px;
    }
    .rail-scroll { flex: 1; overflow: auto; min-height: 0; padding-bottom: 12px; }
    .proj-list { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 4px; }
    .proj-row {
      display: flex; align-items: center; gap: 4px;
      border-radius: 12px;
      padding: 2px;
    }
    .proj-row.active { background: var(--bg-elev); box-shadow: var(--shadow); }
    .proj-row .proj-btn {
      flex: 1; border: none; background: transparent;
      text-align: left; padding: 10px 12px; border-radius: 10px;
      color: var(--ink-2); font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .proj-row.active .proj-btn { color: var(--accent-ink); font-weight: 600; }
    .proj-row .icon-btn {
      border: none; background: transparent; color: var(--muted-2);
      width: 30px; height: 30px; border-radius: 8px; padding: 0;
      display: none; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .proj-row:hover .icon-btn { display: inline-flex; }
    .proj-row .icon-btn:hover { background: var(--bg-muted); color: var(--danger); }
    .rail-actions { padding: 8px 12px 12px; display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--line-2);
      background: var(--bg-elev);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px; font-weight: 550;
      color: var(--ink-2);
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
    }
    .btn:hover { background: var(--bg-soft); border-color: var(--muted-2); }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
      box-shadow: 0 1px 2px rgba(79,70,229,.25);
    }
    .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.sm { padding: 8px 14px; font-size: 13.5px; }
    .btn.block { width: 100%; }
    .rail-foot {
      border-top: 1px solid var(--line);
      padding: 14px 16px;
      font-size: 13px; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .rail-foot .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
    }
    .rail-foot.ok .dot { background: var(--ok); }
    .rail-foot.bad .dot { background: var(--danger); }
    .main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0; min-height: 0;
      background: var(--bg);
    }
    .topbar {
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      min-height: 60px;
    }
    .topbar h1 {
      margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    }
    .topbar .crumb { color: var(--muted); font-size: 14px; margin-left: 8px; font-weight: 400; }
    .topbar .spacer { flex: 1; }
    .topbar .meta { font-size: 13px; color: var(--muted); }
    .stage {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 0; overflow: hidden;
    }
    .panel {
      display: flex; flex-direction: column;
      min-width: 0; min-height: 0; overflow: hidden;
    }
    .chat-scroll {
      flex: 1; overflow: auto; padding: 24px 28px 16px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      display: flex; gap: 12px; max-width: 820px; width: 100%;
      align-self: flex-start;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .av {
      width: 36px; height: 36px; border-radius: 12px; flex: 0 0 auto;
      object-fit: cover; border: 1px solid var(--line); background: #fff;
    }
    .msg .av.user-av {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-muted); font-size: 12px; font-weight: 600; color: var(--muted);
      border: 1px solid var(--line);
    }
    .bubble {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      max-width: min(640px, 100%);
      box-shadow: var(--shadow);
    }
    .msg.user .bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .bubble .who {
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      margin-bottom: 6px;
    }
    .msg.user .bubble .who { color: rgba(255,255,255,.78); }
    .bubble p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble .card {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ink);
    }
    .msg.user .bubble .card {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.25);
      color: #fff;
    }
    .card h4 { margin: 0 0 8px; font-size: 13.5px; font-weight: 600; }
    .card pre {
      margin: 0; font-family: var(--mono); font-size: 12.5px;
      white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto;
      line-height: 1.55;
    }
    .composer {
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(8px);
      padding: 16px 24px 20px;
    }
    .composer-box {
      display: flex; flex-direction: column; gap: 12px;
      border: 1px solid var(--line-2);
      border-radius: 16px;
      background: var(--bg-elev);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .composer-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .composer-box textarea {
      border: none; outline: none; resize: none; background: transparent;
      min-height: 52px; max-height: 160px; width: 100%;
      line-height: 1.5; font-size: 15.5px;
    }
    .composer-row {
      display: flex; align-items: center; gap: 10px;
    }
    .hint {
      font-size: 13px; color: var(--muted);
      flex: 1;
    }
    .hint code {
      font-family: var(--mono); font-size: 12.5px;
      background: var(--bg-muted); padding: 2px 7px; border-radius: 6px;
    }
    .empty {
      margin: auto; text-align: center; padding: 56px 28px; color: var(--muted);
      max-width: 440px;
    }
    .empty h2 { margin: 0 0 10px; color: var(--ink); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .empty p { margin: 0 0 20px; font-size: 15px; line-height: 1.55; }
    .workspace {
      flex: 1; overflow: auto; padding: 24px 28px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .grid-2 {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;
    }
    @media (max-width: 980px) {
      .grid-2 { grid-template-columns: 1fr; }
      .app { grid-template-columns: 72px 1fr; }
      .rail-head .titles, .nav-sec, .nav-item .lbl, .nav-item .badge,
      .rail-actions .btn span, .rail-foot span.txt { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .proj-row .proj-btn { padding: 10px; font-size: 13px; }
      .rail-actions { flex-direction: column; }
    }
    .card-block {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card-block h3 {
      margin: 0 0 14px; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      letter-spacing: -0.01em;
    }
    .map-wrap {
      width: 100%; aspect-ratio: 16/10; background: var(--bg-soft);
      border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; position: relative;
      touch-action: none;
      cursor: grab;
    }
    .map-wrap:active { cursor: grabbing; }
    .map-wrap svg { width: 100%; height: 100%; display: block; }
    .map-toolbar {
      position: absolute; right: 10px; top: 10px; z-index: 2;
      display: flex; gap: 6px;
    }
    .map-toolbar button {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255,255,255,.92);
      box-shadow: var(--shadow); font-size: 16px; font-weight: 600; color: var(--ink-2);
    }
    .map-toolbar button:hover { background: #fff; color: var(--ink); }
    .map-hint {
      position: absolute; left: 12px; bottom: 10px; z-index: 2;
      font-size: 12.5px; color: var(--muted);
      background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--line);
    }
    .map-node { cursor: pointer; }
    .map-node:hover rect, .map-node:hover circle { filter: brightness(0.98); }
    .chain {
      font-family: var(--mono); font-size: 13px; color: var(--ink-2);
      background: var(--bg-soft); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px;
      white-space: pre-wrap; line-height: 1.6;
    }
    .thread-list { display: flex; flex-direction: column; gap: 8px; }
    .thread-item {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; background: var(--bg-soft);
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .thread-item:hover, .thread-item.active {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .thread-item .t-title { flex: 1; font-size: 14.5px; font-weight: 500; }
    .thread-item .t-meta { font-size: 13px; color: var(--muted); }
    .note-list { display: flex; flex-direction: column; gap: 10px; }
    .note {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; background: var(--bg-soft);
    }
    .note .n-meta {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 12.5px; color: var(--muted); margin-bottom: 6px;
    }
    .note .n-body { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
    .note-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .note-form textarea {
      border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; min-height: 72px; resize: vertical; background: #fff;
      font-size: 15px;
    }
    .note-form textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill {
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      background: var(--bg-muted); border-radius: 999px; padding: 6px 12px;
      border: 1px solid var(--line);
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(23,23,23,.32);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; border: 1px solid var(--line);
      width: min(440px, calc(100vw - 32px)); padding: 22px;
      box-shadow: 0 16px 48px rgba(23,23,23,.16);
    }
    .modal h3 { margin: 0 0 14px; font-size: 17px; letter-spacing: -0.02em; }
    .modal input {
      width: 100%; border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 16px; font-size: 15px;
    }
    .modal input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .modal .row { display: flex; justify-content: flex-end; gap: 10px; }
    .cfg-btn {
      border: 1px solid var(--line-2);
      background: var(--bg-elev);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      display: inline-flex; align-items: center; gap: 10px;
      box-shadow: var(--shadow);
      transition: background .12s, border-color .12s, transform .12s;
    }
    .cfg-btn:hover { background: var(--bg-soft); border-color: var(--muted-2); }
    .cfg-btn:active { transform: scale(.98); }
    .cfg-btn .cfg-ico {
      width: 28px; height: 28px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent-ink); font-size: 14px;
      flex: 0 0 auto;
    }
    .cfg-btn .cfg-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .cfg-btn .cfg-copy strong { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
    .cfg-btn .cfg-copy span { font-size: 12.5px; font-weight: 450; color: var(--muted); }
    .rail-foot {
      display: flex !important;
      border-top: 1px solid var(--line);
      padding: 14px 12px;
      gap: 8px;
    }
    .rail-foot .cfg-btn { flex: 1; justify-content: flex-start; padding: 14px 14px; }
    #btn-agent-cfg { padding: 10px 14px; }
    .settings-backdrop {
      position: fixed; inset: 0; background: rgba(23,23,23,.32);
      display: none; align-items: center; justify-content: center; z-index: 60;
    }
    .settings-backdrop.show { display: flex; }
    .settings-panel {
      background: #fff; border-radius: 16px; border: 1px solid var(--line);
      width: min(520px, calc(100vw - 32px)); max-height: min(86vh, 760px);
      overflow: auto; padding: 22px; box-shadow: 0 16px 48px rgba(23,23,23,.16);
    }
    .settings-panel h3 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.02em; }
    .settings-panel .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .settings-panel label {
      display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
      margin: 14px 0 8px;
    }
    .settings-panel label:first-of-type { margin-top: 0; }
    .settings-panel textarea, .settings-panel input[type="text"] {
      width: 100%; border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 14px; font: inherit; background: #fff; color: var(--ink);
    }
    .settings-panel textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .settings-panel textarea:focus, .settings-panel input[type="text"]:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .tone-grid, .type-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .type-grid { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 640px) { .type-grid { grid-template-columns: 1fr; } }
    .choice {
      border: 1px solid var(--line-2); border-radius: 12px;
      padding: 12px 12px; background: var(--bg-soft); text-align: left;
      color: var(--ink-2); font-size: 14px; font-weight: 500;
    }
    .choice:hover { border-color: var(--muted-2); }
    .choice.active {
      border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    .choice small { display: block; margin-top: 4px; color: var(--muted); font-weight: 400; font-size: 12.5px; }
    .settings-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .chat-welcome {
      margin: auto;
      text-align: center;
      padding: 64px 28px 40px;
      max-width: 520px;
      color: var(--muted);
    }
    .chat-welcome img {
      width: 88px; height: 88px; border-radius: 24px;
      object-fit: cover; border: 1px solid var(--line);
      box-shadow: var(--shadow); margin-bottom: 22px;
      animation: av-breathe 4.8s ease-in-out infinite;
    }
    .chat-welcome h2 {
      margin: 0 0 10px; color: var(--ink);
      font-size: 22px; font-weight: 600; letter-spacing: -0.03em;
    }
    .chat-welcome p {
      margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--muted);
    }
    html[data-tone="cool"] {
      --bg: #f3f5f8; --bg-elev: #ffffff; --bg-soft: #f7f9fc; --bg-muted: #e8edf3;
      --rail: #f5f7fa; --line: #e2e8f0; --line-2: #cbd5e1;
      --accent: #2563eb; --accent-soft: #eff6ff; --accent-ink: #1d4ed8;
    }
    html[data-tone="warm"] {
      --bg: #f4f2ee; --bg-elev: #ffffff; --bg-soft: #faf9f7; --bg-muted: #eeebe6;
      --rail: #f7f6f3; --line: #e7e5e0; --line-2: #d6d3cd;
      --accent: #4f46e5; --accent-soft: #eef2ff; --accent-ink: #3730a3;
    }
    html[data-tone="ink"] {
      --bg: #f0f0f0; --bg-elev: #ffffff; --bg-soft: #f7f7f7; --bg-muted: #e5e5e5;
      --rail: #f5f5f5; --line: #e5e5e5; --line-2: #d4d4d4;
      --accent: #171717; --accent-soft: #f5f5f5; --accent-ink: #171717;
    }
    html[data-type="compact"] body { font-size: 14.5px; }
    html[data-type="comfortable"] body { font-size: 15.5px; }
    html[data-type="roomy"] body { font-size: 16.5px; }
    html[data-type="compact"] .bubble p, html[data-type="compact"] .composer-box textarea { font-size: 14.5px; }
    html[data-type="roomy"] .bubble p, html[data-type="roomy"] .composer-box textarea { font-size: 16.5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<script>
(function () {
  const STORAGE_KEY = 'researchos-v2';
  const SETTINGS_KEY = 'researchos-v2-settings';
  const DEFAULT_SETTINGS = {
    appearance: { tone: 'warm', type: 'comfortable' },
    agent: { persona: '严谨、简洁的科研搭档', instructions: '' },
  };
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      const s = JSON.parse(raw) || {};
      return {
        appearance: Object.assign({}, DEFAULT_SETTINGS.appearance, s.appearance || {}),
        agent: Object.assign({}, DEFAULT_SETTINGS.agent, s.agent || {}),
      };
    } catch (_) {
      return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    }
  }
  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(appSettings));
  }
  function getAgentCfg() { return appSettings.agent || DEFAULT_SETTINGS.agent; }

  /** Stable hooks for future LLM / chat-driven config mutation (stub now). */
  function patchSettings(partial) {
    if (!partial || typeof partial !== 'object') return appSettings;
    if (partial.appearance) {
      appSettings.appearance = Object.assign({}, appSettings.appearance || {}, partial.appearance);
    }
    if (partial.agent) {
      appSettings.agent = Object.assign({}, appSettings.agent || {}, partial.agent);
    }
    saveSettings();
    applyAppearance();
    return appSettings;
  }
  function proposeConfigFromChat(text) {
    // Lightweight demo stub: parse plain intents; real LLM plugs here later.
    const t = String(text || '');
    const patch = {};
    if (/冷(色|灰)|cool/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'cool' });
    if (/暖|warm/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'warm' });
    if (/墨|黑白|ink/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { tone: 'ink' });
    if (/紧凑|compact/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'compact' });
    if (/疏朗|大字|roomy/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'roomy' });
    if (/舒适|comfortable/i.test(t)) patch.appearance = Object.assign({}, patch.appearance || {}, { type: 'comfortable' });
    const persona = t.match(/(?:人设|persona)[:：\s]+([^\n。；;]{2,40})/i);
    if (persona) patch.agent = Object.assign({}, patch.agent || {}, { persona: persona[1].trim() });
    const instr = t.match(/(?:要求|指令|instructions?)[:：\s]+([^\n]{2,200})/i);
    if (instr) patch.agent = Object.assign({}, patch.agent || {}, { instructions: instr[1].trim() });
    if (!Object.keys(patch).length) return null;
    patchSettings(patch);
    return patch;
  }
  window.ResearchOSConfig = {
    get: function () { return JSON.parse(JSON.stringify(appSettings)); },
    patch: patchSettings,
    proposeFromChat: proposeConfigFromChat,
    openAppearance: function () { const b = document.getElementById('btn-appearance'); if (b) b.click(); },
    openAgent: function () { const b = document.getElementById('btn-agent-cfg'); if (b) b.click(); },
    openDsh: openDshBridge,
    dshStatus: refreshDshStatus,
  };

  async function refreshDshStatus() {
    const label = document.getElementById('dsh-status-label');
    try {
      const r = await fetch('/api/dsh/status');
      const j = await r.json();
      if (!label) return j;
      if (!j.listening) label.textContent = '未启动';
      else if (!j.has_launch_token) label.textContent = '缺 token';
      else label.textContent = '本机 :3080';
      return j;
    } catch (e) {
      if (label) label.textContent = '不可达';
      return null;
    }
  }

  async function openDshBridge() {
    const input = document.getElementById('composer-input');
    const text = (input && input.value || '').trim();
    if (text) {
      try {
        await fetch('/api/dsh/handoff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, source: 'researchos-shell' }),
        });
        try { await navigator.clipboard.writeText(text); } catch (_) {}
      } catch (_) {}
    }
    // Same-tab navigation through backend redirect so THIS browser gets the DSH cookie.
    window.open('/api/dsh/open', '_blank', 'noopener');
    refreshDshStatus();
  }

  const btnDsh = document.getElementById('btn-dsh');
  if (btnDsh) btnDsh.addEventListener('click', function (e) { e.preventDefault(); openDshBridge(); });
  const btnHandoff = document.getElementById('btn-dsh-handoff');
  if (btnHandoff) btnHandoff.addEventListener('click', function (e) { e.preventDefault(); openDshBridge(); });
  refreshDshStatus();
  setInterval(refreshDshStatus, 15000);

  function applyAppearance() {
    const a = appSettings.appearance || DEFAULT_SETTINGS.appearance;
    document.documentElement.setAttribute('data-tone', a.tone || 'warm');
    document.documentElement.setAttribute('data-type', a.type || 'comfortable');
  }

  const RAIL_META = {
    ideas:   { title: '点子',   seed: '' },
    feed:    { title: '动态',   seed: '' },
    goals:   { title: '目标',   seed: '' },
    library: { title: '资源库', seed: '' },
  };

  const SAMPLE_CHAIN = '';

  function uid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function nowIso() { return new Date().toISOString(); }
  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleString('zh-CN', { hour12: false });
    } catch (_) { return iso; }
  }

  function defaultState() {
    return {
      version: 2,
      mainThread: {
        id: 'main',
        title: '主聊天',
        messages: [],
      },
      projects: [],
      ui: {
        view: 'main',
        activeProjectId: null,
        activeRail: 'ideas',
      },
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const s = JSON.parse(raw);
      if (!s || s.version !== 2 || !s.mainThread || !Array.isArray(s.projects)) return defaultState();
      if (!Array.isArray(s.mainThread.messages)) s.mainThread.messages = [];
      if (!s.ui) s.ui = { view: 'main', activeProjectId: null, activeRail: 'ideas' };
      return s;
    } catch (_) {
      return defaultState();
    }
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  let appSettings = loadSettings();
  let modalMode = null;
  applyAppearance();
  try {
    const flag = 'researchos-v2-empty-main-v1';
    if (!localStorage.getItem(flag)) {
      if (state.mainThread && Array.isArray(state.mainThread.messages) && state.mainThread.messages.length) {
        state.mainThread.messages = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
      localStorage.setItem(flag, '1');
    }
  } catch (_) {}

  const $ = (sel) => document.querySelector(sel);
  const chatScroll = $('#chat-scroll');
  const composer = $('#composer-input');

  function activeProject() {
    return state.projects.find(p => p.id === state.ui.activeProjectId) || null;
  }
  function activeThread(proj) {
    const p = proj || activeProject();
    if (!p) return null;
    return p.threads.find(t => t.id === p.activeThreadId) || p.threads[0] || null;
  }
  function currentMessages() {
    if (state.ui.view === 'main') return state.mainThread.messages;
    const t = activeThread();
    return t ? t.messages : [];
  }

  async function checkHealth() {
    try { await fetch('/api/health'); } catch (_) {}
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

  function renderNav() {
    $('#proj-count').textContent = String(state.projects.length);
    const list = $('#proj-list');
    list.innerHTML = '';
    state.projects.forEach(p => {
      const row = document.createElement('div');
      row.className = 'proj-row' + (p.id === state.ui.activeProjectId ? ' active' : '');
      row.innerHTML =
        '<button class="proj-btn" title="' + escapeAttr(p.name) + '">' + escapeHtml(p.name) + '</button>' +
        '<button class="icon-btn" title="删除" data-del="' + p.id + '">✕</button>';
      row.querySelector('.proj-btn').onclick = () => {
        state.ui.activeProjectId = p.id;
        state.ui.view = 'space';
        saveState(); render();
      };
      row.querySelector('.icon-btn').onclick = (e) => {
        e.stopPropagation();
        deleteProject(p.id);
      };
      list.appendChild(row);
    });

    const showProjRails = !!activeProject() && (state.ui.view === 'space' || state.ui.view === 'project-chat' || state.ui.view === 'rail');
    $('#proj-nav-block').classList.toggle('hidden', !showProjRails);

    document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
      btn.classList.toggle('active',
        (btn.dataset.nav === 'main' && state.ui.view === 'main') ||
        (btn.dataset.nav === 'space' && (state.ui.view === 'space' || state.ui.view === 'project-chat'))
      );
    });
    document.querySelectorAll('.nav-item[data-rail]').forEach(btn => {
      btn.classList.toggle('active', state.ui.view === 'rail' && state.ui.activeRail === btn.dataset.rail);
    });
  }

  function renderTop() {
    const p = activeProject();
    const t = activeThread(p);
    if (state.ui.view === 'main') {
      $('#top-title').innerHTML = '主聊天';
          } else if (state.ui.view === 'space') {
      $('#top-title').innerHTML = '个人空间' + (p ? ' <span class="crumb">' + escapeHtml(p.name) + '</span>' : '');
          } else if (state.ui.view === 'project-chat') {
      $('#top-title').innerHTML = escapeHtml(p ? p.name : '项目') +
        (t ? ' <span class="crumb">' + escapeHtml(t.title) + '</span>' : '');
          } else if (state.ui.view === 'rail') {
      const meta = RAIL_META[state.ui.activeRail];
      $('#top-title').innerHTML = escapeHtml(meta.title) +
        (p ? ' <span class="crumb">' + escapeHtml(p.name) + '</span>' : '');
          }
  }

  function renderChat() {
    const msgs = currentMessages();
    chatScroll.innerHTML = '';
    if (!msgs.length) {
      const welcome = document.createElement('div');
      welcome.className = 'chat-welcome';
      if (state.ui.view === 'main') {
        welcome.innerHTML =
          '<img src="avatar.png" alt="" />' +
          '<h2>你好，我是 Research Companion</h2>' +
          '<p>告诉我你正在研究什么，或想一起推进的问题。</p>';
      } else {
        welcome.innerHTML =
          '<h2>开始新对话</h2>' +
          '<p>写下你想讨论的内容。</p>';
      }
      chatScroll.appendChild(welcome);
      return;
    }
    msgs.forEach(m => {
      const el = document.createElement('div');
      el.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
      const av = m.role === 'user'
        ? '<div class="av user-av">你</div>'
        : '<img class="av" src="avatar.png" alt="" />';
      let body = '<div class="who">' + (m.role === 'user' ? '你' : 'Research Companion') +
        ' · ' + fmtTime(m.ts) + '</div><p>' + escapeHtml(m.text) + '</p>';
      if (m.card) {
        body += '<div class="card"><h4>' + escapeHtml(m.card.title || '结果') + '</h4>';
        if (m.card.pre) body += '<pre>' + escapeHtml(m.card.pre) + '</pre>';
        body += '</div>';
      }
      el.innerHTML = av + '<div class="bubble">' + body + '</div>';
      chatScroll.appendChild(el);
    });
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  const mapUi = { zoom: 1, panX: 0, panY: 0, expanded: { ideas: true, feed: true, goals: true, library: true } };

  function truncateMapLabel(s, n) {
    const t = String(s || '').replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    return t.slice(0, n - 1) + '…';
  }

  function renderMindMap(proj) {
    const wrap = $('#mind-map');
    if (!proj) { wrap.innerHTML = ''; return; }

    const rails = {
      ideas: proj.rails.ideas || [],
      feed: proj.rails.feed || [],
      goals: proj.rails.goals || [],
      library: proj.rails.library || [],
    };
    const total = rails.ideas.length + rails.feed.length + rails.goals.length + rails.library.length;
    const meta = {
      ideas:   { label: '点子',   x: 180, y: 140, fill: '#eef2ff', stroke: '#4f46e5', ink: '#3730a3' },
      feed:    { label: '动态',   x: 760, y: 140, fill: '#f5f3ff', stroke: '#7c3aed', ink: '#6d28d9' },
      goals:   { label: '目标',   x: 180, y: 460, fill: '#ecfdf5', stroke: '#059669', ink: '#047857' },
      library: { label: '资源库', x: 760, y: 460, fill: '#fffbeb', stroke: '#d97706', ink: '#b45309' },
    };
    const core = { x: 470, y: 300 };
    const vbW = 940, vbH = 600;

    // layout child nodes in an arc around each cluster when expanded
    function childPositions(key, notes) {
      const m = meta[key];
      const n = notes.length;
      if (!n) return [];
      const out = [];
      const spread = Math.min(Math.PI * 0.95, 0.42 * n + 0.55);
      const start = -spread / 2;
      const radius = 118 + Math.min(40, n * 4);
      const outward = {
        ideas: Math.PI * 1.15,
        feed: Math.PI * -0.15,
        goals: Math.PI * 0.85,
        library: Math.PI * 0.15,
      }[key];
      for (let i = 0; i < n; i++) {
        const ang = outward + start + (n === 1 ? spread / 2 : (spread * i) / (n - 1));
        out.push({
          x: m.x + Math.cos(ang) * radius,
          y: m.y + Math.sin(ang) * radius,
          note: notes[i],
        });
      }
      return out;
    }

    let edges = '';
    let nodes = '';
    // hub-core edges always
    Object.keys(meta).forEach(function (key) {
      const m = meta[key];
      edges += '<line x1="' + core.x + '" y1="' + core.y + '" x2="' + m.x + '" y2="' + m.y +
        '" stroke="#d6d3cd" stroke-width="1.6" />';
    });

    Object.keys(meta).forEach(function (key) {
      const m = meta[key];
      const notes = rails[key];
      const expanded = !!mapUi.expanded[key] && notes.length > 0;
      const count = notes.length;

      nodes += '<g class="map-node" data-cluster="' + key + '">' +
        '<rect x="' + (m.x - 64) + '" y="' + (m.y - 28) + '" width="128" height="56" rx="14" fill="' + m.fill +
        '" stroke="' + m.stroke + '" stroke-width="1.8"/>' +
        '<text x="' + m.x + '" y="' + (m.y - 2) + '" text-anchor="middle" font-size="14" font-weight="650" fill="' + m.ink + '">' +
        m.label + '</text>' +
        '<text x="' + m.x + '" y="' + (m.y + 16) + '" text-anchor="middle" font-size="12" fill="#52525b">' +
        count + ' 条' + (count ? (expanded ? ' · 收起' : ' · 展开') : '') + '</text></g>';

      if (expanded) {
        childPositions(key, notes).forEach(function (c, idx) {
          edges += '<line x1="' + m.x + '" y1="' + m.y + '" x2="' + c.x + '" y2="' + c.y +
            '" stroke="' + m.stroke + '" stroke-opacity="0.35" stroke-width="1.4" />';
          const label = truncateMapLabel(c.note.text, 16);
          nodes += '<g class="map-leaf" data-rail="' + key + '" data-idx="' + idx + '">' +
            '<rect x="' + (c.x - 70) + '" y="' + (c.y - 22) + '" width="140" height="44" rx="12" fill="#fff" stroke="' +
            m.stroke + '" stroke-width="1.2"/>' +
            '<text x="' + c.x + '" y="' + (c.y + 5) + '" text-anchor="middle" font-size="12" fill="#3f3f46">' +
            escapeHtml(label) + '</text></g>';
        });
      }
    });

    // core
    nodes += '<g class="map-core">' +
      '<circle cx="' + core.x + '" cy="' + core.y + '" r="46" fill="#fff" stroke="#e7e5e0" stroke-width="1.8"/>' +
      '<text x="' + core.x + '" y="' + (core.y - 4) + '" text-anchor="middle" font-size="14" font-weight="650" fill="#171717">课题核心</text>' +
      '<text x="' + core.x + '" y="' + (core.y + 14) + '" text-anchor="middle" font-size="12" fill="#71717a">' +
      escapeHtml(truncateMapLabel(proj.name, 10)) + '</text></g>';

    const emptyHint = total === 0
      ? '暂无记录 · 在点子/动态/目标/资源库添加后，地图会展开节点'
      : '拖动画布平移 · 滚轮缩放 · 点击色块展开/收起';

    wrap.innerHTML =
      '<div class="map-toolbar">' +
      '<button type="button" data-map="zoom-in" title="放大">+</button>' +
      '<button type="button" data-map="zoom-out" title="缩小">−</button>' +
      '<button type="button" data-map="reset" title="复位">⌂</button>' +
      '</div>' +
      '<div class="map-hint">' + emptyHint + '</div>' +
      '<svg viewBox="0 0 ' + vbW + ' ' + vbH + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="课题关系图">' +
      '<rect width="' + vbW + '" height="' + vbH + '" fill="#faf9f7"/>' +
      '<g id="map-world" transform="translate(' + mapUi.panX + ',' + mapUi.panY + ') scale(' + mapUi.zoom + ')">' +
      '<g id="map-edges">' + edges + '</g>' +
      '<g id="map-nodes" font-family="Inter, system-ui, sans-serif">' + nodes + '</g>' +
      '</g></svg>';

    bindMindMapInteractions(wrap, proj);
  }

  function bindMindMapInteractions(wrap, proj) {
    const world = wrap.querySelector('#map-world');
    if (!world) return;

    function applyTransform() {
      world.setAttribute('transform', 'translate(' + mapUi.panX + ',' + mapUi.panY + ') scale(' + mapUi.zoom + ')');
    }

    wrap.querySelectorAll('[data-map]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        const act = btn.getAttribute('data-map');
        if (act === 'zoom-in') mapUi.zoom = Math.min(2.4, mapUi.zoom * 1.18);
        if (act === 'zoom-out') mapUi.zoom = Math.max(0.55, mapUi.zoom / 1.18);
        if (act === 'reset') { mapUi.zoom = 1; mapUi.panX = 0; mapUi.panY = 0; }
        applyTransform();
      };
    });

    wrap.querySelectorAll('.map-node').forEach(function (g) {
      g.addEventListener('click', function (e) {
        e.stopPropagation();
        const key = g.getAttribute('data-cluster');
        const notes = (proj.rails[key] || []);
        if (!notes.length) {
          // jump to rail to add
          state.ui.activeRail = key;
          state.ui.view = 'rail';
          saveState(); render();
          return;
        }
        mapUi.expanded[key] = !mapUi.expanded[key];
        renderMindMap(proj);
      });
    });

    let dragging = false, lx = 0, ly = 0;
    wrap.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button') || e.target.closest('.map-node') || e.target.closest('.map-leaf')) return;
      dragging = true; lx = e.clientX; ly = e.clientY;
      try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    });
    wrap.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      mapUi.panX += (e.clientX - lx);
      mapUi.panY += (e.clientY - ly);
      lx = e.clientX; ly = e.clientY;
      applyTransform();
    });
    wrap.addEventListener('pointerup', function () { dragging = false; });
    wrap.addEventListener('pointercancel', function () { dragging = false; });
    wrap.addEventListener('wheel', function (e) {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.92 : 1.08;
      mapUi.zoom = Math.min(2.4, Math.max(0.55, mapUi.zoom * factor));
      applyTransform();
    }, { passive: false });
  }

  function renderSpace() {
    const p = activeProject();
    if (!p) {
      $('#space-empty').classList.remove('hidden');
      $('#space-active').classList.add('hidden');
      return;
    }
    $('#space-empty').classList.add('hidden');
    $('#space-active').classList.remove('hidden');
    $('#proj-desc').textContent = '创建于 ' + fmtTime(p.createdAt) + ' · 更新 ' + fmtTime(p.updatedAt);
    $('#thought-chain').textContent = SAMPLE_CHAIN || '在对话中推进后，关键步骤会出现在这里。';
    const pills = $('#chain-pills');
    pills.innerHTML = '';
    renderMindMap(p);
    const tl = $('#thread-list');
    tl.innerHTML = '';
    p.threads.forEach(t => {
      const item = document.createElement('div');
      item.className = 'thread-item' + (t.id === p.activeThreadId ? ' active' : '');
      item.innerHTML = '<div class="t-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="t-meta">' + (t.messages || []).length + ' · ' + fmtTime(t.updatedAt || p.updatedAt) + '</div>';
      item.onclick = () => {
        p.activeThreadId = t.id;
        state.ui.view = 'project-chat';
        saveState(); render();
      };
      tl.appendChild(item);
    });
  }

  function renderRail() {
    const p = activeProject();
    const key = state.ui.activeRail;
    const meta = RAIL_META[key];
    $('#rail-title').textContent = meta.title;
    $('#rail-sub').textContent = '记录与本项目相关的' + meta.title + '。';
    const list = $('#note-list');
    list.innerHTML = '';
    const notes = (p && p.rails[key]) || [];
    if (!notes.length) {
      list.innerHTML = '<div class="note"><div class="n-body" style="color:var(--muted)">暂无条目，在下方添加一条。</div></div>';
      return;
    }
    notes.slice().reverse().forEach(n => {
      const el = document.createElement('div');
      el.className = 'note';
      el.innerHTML = '<div class="n-meta"><span>' + escapeHtml(n.source || 'manual') + '</span><span>' +
        fmtTime(n.ts) + '</span></div><div class="n-body">' + escapeHtml(n.text) + '</div>';
      list.appendChild(el);
    });
  }

  function render() {
    renderNav();
    renderTop();
    const view = state.ui.view;
    $('#panel-chat').classList.toggle('hidden', !(view === 'main' || view === 'project-chat'));
    $('#panel-space').classList.toggle('hidden', view !== 'space');
    $('#panel-rail').classList.toggle('hidden', view !== 'rail');
    if (view === 'main' || view === 'project-chat') renderChat();
    if (view === 'space') renderSpace();
    if (view === 'rail') renderRail();
  }

  function pushMessage(role, text, card) {
    const msg = { id: uid('m'), role: role, text: text, ts: nowIso() };
    if (card) msg.card = card;
    if (state.ui.view === 'main') {
      state.mainThread.messages.push(msg);
    } else {
      const p = activeProject();
      const t = activeThread(p);
      if (!p || !t) return;
      t.messages.push(msg);
      t.updatedAt = nowIso();
      p.updatedAt = nowIso();
    }
    saveState();
  }

  function addNote(rail, text, source) {
    const p = activeProject();
    if (!p) return false;
    if (!RAIL_META[rail]) return false;
    if (!p.rails[rail]) p.rails[rail] = [];
    p.rails[rail].push({ id: uid('n'), text: text.trim(), source: source || 'manual', ts: nowIso() });
    p.updatedAt = nowIso();
    saveState();
    return true;
  }

  function summarizeP0(j) {
    const steps = (j && j.steps) || [];
    let short = '完成';
    let lines = [];
    if (j && j.ok === false) {
      return { text: 'P0 返回失败：' + JSON.stringify(j).slice(0, 400), short: 'fail', card: null };
    }
    if (Array.isArray(steps) && steps.length) {
      short = steps.length + ' 步';
      lines = steps.map(function (s, i) {
        const name = s.skill || s.name || ('step-' + (i + 1));
        return (i + 1) + '. ' + name + ' ✓';
      });
    } else {
      lines = ['direction-framing', 'rq-decomposition', 'seed-paper-neighborhood', 'foundational-frontier-split', 'evidence-ledger']
        .map(function (n, i) { return (i + 1) + '. ' + n + ' ✓'; });
    }
    const ledger = j && j.ledger;
    let gapN = 0, rowN = 0;
    if (ledger) {
      rowN = (ledger.rows || []).length;
      gapN = (ledger.gaps || []).length;
    }
    const extra = (rowN || gapN) ? ('\n账本 ' + rowN + ' 行 / gap ' + gapN) : '';
    const text = '已完成研究链路。\n' + lines.join('\n') + extra;
    const pre = JSON.stringify({
      ok: j && j.ok,
      skill: j && j.skill,
      interest: j && j.interest,
      demo_locked_rq: j && j.demo_locked_rq,
      ledger_rows: rowN,
      gaps: gapN,
    }, null, 2);
    return { text: text, short: short + (gapN ? (' · gap ' + gapN) : ''), card: { title: '链路结果', pre: pre } };
  }

  async function runP0Chain(interest) {
    const q = (interest || '').trim() || 'human-guided research companion dual-shelf literature';
    pushMessage('assistant', '正在梳理研究链路…');
    render();
    try {
      const r = await fetch('/api/skills/run/p0-chain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ interest: q, question: q }),
      });
      const j = await r.json();
      const summary = summarizeP0(j);
      pushMessage('assistant', summary.text, summary.card);
      if (activeProject()) {
        addNote('feed', '链路完成：' + summary.short, 'chain');
        addNote('library', '结果已记入本项目资源', 'chain');
      }
      saveState();
      render();
      return j;
    } catch (e) {
      pushMessage('assistant', '链路调用失败：' + (e && e.message ? e.message : String(e)));
      render();
      return null;
    }
  }

  async function handleUserText(raw) {
    const text = (raw || '').trim();
    if (!text) return;
    pushMessage('user', text);
    render();

    const noteMatch = text.match(/^\/note\s+(ideas|feed|goals|library)\s+([\s\S]+)$/i);
    if (noteMatch) {
      const rail = noteMatch[1].toLowerCase();
      const body = noteMatch[2].trim();
      if (!activeProject()) {
        pushMessage('assistant', '请先在个人空间选中或新建一个项目，再写入笔记。');
      } else if (addNote(rail, body, state.ui.view === 'main' ? 'main-chat' : 'project-chat')) {
        pushMessage('assistant', '已写入项目「' + activeProject().name + '」的 ' + RAIL_META[rail].title + '。');
      }
      render();
      return;
    }
    if (/^\/p0-chain\b/i.test(text) || /^跑\s*p0/i.test(text)) {
      const interest = text.replace(/^\/p0-chain\b/i, '').replace(/^跑\s*p0(全链)?/i, '').trim();
      await runP0Chain(interest || text);
      return;
    }
    const cfgPatch = proposeConfigFromChat(text);
    if (cfgPatch) {
      const bits = [];
      if (cfgPatch.appearance) bits.push('外观已更新');
      if (cfgPatch.agent) bits.push('助理配置已更新');
      pushMessage('assistant', bits.join('，') + '。也可随时点右上角「助理配置」或左下「外观配置」微调。');
      render();
      return;
    }
    const agent = getAgentCfg();
    const persona = (agent.persona || '').trim();
    const instr = (agent.instructions || '').trim();
    let reply = '收到。我可以帮你一起梳理方向、拆问题，或整理到个人空间的项目里。';
    if (persona) reply = '收到（' + persona + '）。我们先把问题说清楚，再决定下一步。';
    if (instr) reply += '\n（已按你的助理要求作答。）';
    pushMessage('assistant', reply);
    render();
  }

  function openModal(mode, preset) {
    modalMode = mode;
    $('#modal').classList.add('show');
    const input = $('#modal-input');
    if (mode === 'create') {
      $('#modal-title').textContent = '新建项目';
      input.value = '';
      input.placeholder = '项目名称';
    } else if (mode === 'rename') {
      $('#modal-title').textContent = '重命名项目';
      input.value = preset || '';
      input.placeholder = '新名称';
    } else if (mode === 'thread') {
      $('#modal-title').textContent = '新建对话';
      input.value = '';
      input.placeholder = '对话标题';
    }
    setTimeout(function () { input.focus(); }, 50);
  }
  function closeModal() {
    $('#modal').classList.remove('show');
    modalMode = null;
  }

  function createProject(name) {
    const n = (name || '').trim() || ('课题 ' + (state.projects.length + 1));
    const tid = uid('thr');
    const p = {
      id: uid('proj'),
      name: n,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      activeThreadId: tid,
      threads: [{
        id: tid,
        title: '默认对话',
        messages: [],
        updatedAt: nowIso(),
      }],
      rails: { ideas: [], feed: [], goals: [], library: [] },
    };
    state.projects.unshift(p);
    state.ui.activeProjectId = p.id;
    state.ui.view = 'space';
    saveState(); render();
  }

  function deleteProject(id) {
    if (!confirm('删除该项目及其对话 / 笔记？')) return;
    state.projects = state.projects.filter(function (p) { return p.id !== id; });
    if (state.ui.activeProjectId === id) {
      state.ui.activeProjectId = state.projects[0] ? state.projects[0].id : null;
      state.ui.view = state.ui.activeProjectId ? 'space' : 'main';
    }
    saveState(); render();
  }

  function renameProject(name) {
    const p = activeProject();
    if (!p) return;
    const n = (name || '').trim();
    if (!n) return;
    p.name = n; p.updatedAt = nowIso();
    saveState(); render();
  }

  function createThread(title) {
    const p = activeProject();
    if (!p) return;
    const t = {
      id: uid('thr'),
      title: (title || '').trim() || ('对话 ' + (p.threads.length + 1)),
      messages: [],
      updatedAt: nowIso(),
    };
    p.threads.unshift(t);
    p.activeThreadId = t.id;
    p.updatedAt = nowIso();
    state.ui.view = 'project-chat';
    saveState(); render();
  }

  $('#nav-main').onclick = function () { state.ui.view = 'main'; saveState(); render(); };
  $('#nav-space').onclick = function () { state.ui.view = 'space'; saveState(); render(); };
  document.querySelectorAll('.nav-item[data-rail]').forEach(function (btn) {
    btn.onclick = function () {
      if (!activeProject()) { state.ui.view = 'space'; saveState(); render(); return; }
      state.ui.activeRail = btn.dataset.rail;
      state.ui.view = 'rail';
      saveState(); render();
    };
  });
  $('#btn-new-project').onclick = function () { openModal('create'); };
  $('#btn-new-project-2').onclick = function () { openModal('create'); };
  $('#btn-rename-project').onclick = function () {
    const p = activeProject();
    if (p) openModal('rename', p.name);
  };
  $('#btn-delete-project').onclick = function () {
    const p = activeProject();
    if (p) deleteProject(p.id);
  };
  $('#btn-new-thread').onclick = function () { openModal('thread'); };
  $('#btn-open-chat').onclick = function () {
    if (!activeProject()) return;
    state.ui.view = 'project-chat';
    saveState(); render();
  };
  $('#modal-cancel').onclick = closeModal;
  $('#modal-ok').onclick = function () {
    const v = $('#modal-input').value;
    if (modalMode === 'create') createProject(v);
    else if (modalMode === 'rename') renameProject(v);
    else if (modalMode === 'thread') createThread(v);
    closeModal();
  };
  $('#modal-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#modal-ok').click(); }
    if (e.key === 'Escape') closeModal();
  });
  $('#btn-send').onclick = function () {
    const v = composer.value;
    composer.value = '';
    handleUserText(v);
  };
  const btnP0 = $('#btn-run-p0');
  if (btnP0) {
    btnP0.onclick = function () {
      const v = composer.value.trim();
      runP0Chain(v);
      composer.value = '';
    };
  }
  composer.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('#btn-send').click();
    }
  });
  $('#btn-add-note').onclick = function () {
    const v = $('#note-input').value.trim();
    if (!v) return;
    if (addNote(state.ui.activeRail, v, 'rail-push')) {
      $('#note-input').value = '';
      render();
    } else {
      alert('请先选择项目');
    }
  };


  function syncAppearanceChoices() {
    const a = appSettings.appearance || DEFAULT_SETTINGS.appearance;
    document.querySelectorAll('#tone-grid .choice').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tone === a.tone);
    });
    document.querySelectorAll('#type-grid .choice').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.type === a.type);
    });
  }
  function openAppearance() {
    syncAppearanceChoices();
    $('#modal-appearance').classList.add('show');
  }
  function closeAppearance() {
    $('#modal-appearance').classList.remove('show');
  }
  function openAgentCfg() {
    const ag = getAgentCfg();
    $('#agent-persona').value = ag.persona || '';
    $('#agent-instructions').value = ag.instructions || '';
    $('#modal-agent').classList.add('show');
    setTimeout(function () { $('#agent-persona').focus(); }, 40);
  }
  function closeAgentCfg() {
    $('#modal-agent').classList.remove('show');
  }
  function saveAgentCfg() {
    appSettings.agent = {
      persona: ($('#agent-persona').value || '').trim(),
      instructions: ($('#agent-instructions').value || '').trim(),
    };
    saveSettings();
    closeAgentCfg();
  }

  const btnAppearance = $('#btn-appearance');
  if (btnAppearance) btnAppearance.onclick = openAppearance;
  const btnAgent = $('#btn-agent-cfg');
  if (btnAgent) btnAgent.onclick = openAgentCfg;
  const appearanceClose = $('#appearance-close');
  if (appearanceClose) appearanceClose.onclick = closeAppearance;
  const agentCancel = $('#agent-cancel');
  if (agentCancel) agentCancel.onclick = closeAgentCfg;
  const agentSave = $('#agent-save');
  if (agentSave) agentSave.onclick = saveAgentCfg;
  document.querySelectorAll('#tone-grid .choice').forEach(function (btn) {
    btn.onclick = function () {
      appSettings.appearance = appSettings.appearance || {};
      appSettings.appearance.tone = btn.dataset.tone;
      saveSettings();
      applyAppearance();
      syncAppearanceChoices();
    };
  });
  document.querySelectorAll('#type-grid .choice').forEach(function (btn) {
    btn.onclick = function () {
      appSettings.appearance = appSettings.appearance || {};
      appSettings.appearance.type = btn.dataset.type;
      saveSettings();
      applyAppearance();
      syncAppearanceChoices();
    };
  });
  $('#modal-appearance').addEventListener('click', function (e) {
    if (e.target === $('#modal-appearance')) closeAppearance();
  });
  $('#modal-agent').addEventListener('click', function (e) {
    if (e.target === $('#modal-agent')) closeAgentCfg();
  });

  checkHealth();
  setInterval(checkHealth, 15000);
  render();
})();
</script>
</body>
